<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Email Verification</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.6/dist/umd/supabase.min.js">
    </script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0f172a;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            margin: 0;
        }
        .card {
            background: #1e293b;
            padding: 40px;
            border-radius: 16px;
            max-width: 500px;
            width: 100%;
            border: 1px solid #334155;
            text-align: center;
        }
        .success { color: #4ade80; padding: 16px; background: rgba(74,222,128,0.1); border-radius: 8px; border: 1px solid rgba(74,222,128,0.2); margin: 16px 0; }
        .error { color: #f87171; padding: 16px; background: rgba(248,113,113,0.1); border-radius: 8px; border: 1px solid rgba(248,113,113,0.2); margin: 16px 0; }
        .loading { color: #fbbf24; padding: 16px; }
        .btn { padding: 12px 32px; border: none; border-radius: 8px; font-size: 0.95rem; font-weight: 600; cursor: pointer; background: #00bcd4; color: #0f172a; text-decoration: none; display: inline-block; }
        .btn:hover { background: #008c9e; }
        h1 { font-size: 1.8rem; background: linear-gradient(90deg, #00bcd4, #008c9e); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 8px; }
        .log { background: #0f172a; padding: 12px; border-radius: 8px; margin-top: 16px; font-size: 0.7rem; color: #64748b; max-height: 150px; overflow-y: auto; font-family: monospace; text-align: left; border: 1px solid #1e293b; white-space: pre-wrap; word-break: break-all; }
        .log .info { color: #00bcd4; }
        .log .success { color: #4ade80; }
        .log .error { color: #f87171; }
    </style>
</head>
<body>

    <div class="card">
        <h1>⚡ Email Verification</h1>
        <div id="status" class="loading">⏳ Verifying your email...</div>
        <div id="result"></div>
        <div class="log" id="log">🔍 Waiting for verification...</div>
    </div>

    <script>
        const SUPABASE_URL = 'https://pfnbpgdtrxqyudeqrtbr.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_L9nklf0aUlRHBVuc6V-nFg_DqW79DV4';
        const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        function log(msg, type = 'info') {
            const el = document.getElementById('log');
            const cls = type === 'error' ? 'error' : type === 'success' ? 'success' : 'info';
            el.innerHTML += `\n[${new Date().toLocaleTimeString()}] <span class="${cls}">${msg}</span>`;
            el.scrollTop = el.scrollHeight;
        }

        function showStatus(msg, type = 'loading') {
            document.getElementById('status').textContent = msg;
            document.getElementById('status').className = type;
        }

        async function verifyEmail() {
            try {
                const params = new URLSearchParams(window.location.search);
                const token = params.get('token');
                
                log('🔍 URL: ' + window.location.href, 'info');

                if (token) {
                    log('🔑 Found token: ' + token, 'info');
                    
                    // Verify with Supabase
                    const { data, error } = await supabase.auth.verifyOtp({
                        token_hash: token,
                        type: 'signup'
                    });

                    if (error) throw error;

                    log('✅ Supabase verification successful!', 'success');

                    // Update users table
                    const { error: updateError } = await supabase
                        .from('users')
                        .update({ 
                            email_verified: true, 
                            status: 'active' 
                        })
                        .eq('email', data.user.email);

                    if (updateError) throw updateError;

                    log('✅ Database updated!', 'success');

                    document.getElementById('result').innerHTML = `
                        <div class="success">
                            <p style="font-size:1.1rem;">🎉 Email Verified Successfully!</p>
                            <p style="color:#94a3b8; font-size:0.9rem; margin:8px 0;">You can now log in to the admin panel.</p>
                            <a href="admin.html" class="btn" style="margin-top:8px;">🔐 Go to Admin Login</a>
                        </div>
                    `;
                    showStatus('✅ Verified!', 'success');

                } else {
                    // No token - check if already verified
                    const { data: { session } } = await supabase.auth.getSession();
                    if (session) {
                        const { data: user } = await supabase
                            .from('users')
                            .select('email_verified')
                            .eq('id', session.user.id)
                            .maybeSingle();
                            
                        if (user?.email_verified) {
                            document.getElementById('result').innerHTML = `
                                <div class="success">
                                    <p style="font-size:1.1rem;">✅ Already Verified!</p>
                                    <a href="admin.html" class="btn" style="margin-top:8px;">🔐 Go to Admin Login</a>
                                </div>
                            `;
                            showStatus('✅ Already verified', 'success');
                            return;
                        }
                    }

                    document.getElementById('result').innerHTML = `
                        <div class="error">
                            <p style="font-size:1rem;">No verification token found.</p>
                            <p style="color:#94a3b8; font-size:0.9rem;">Please check your email for the verification link.</p>
                            <a href="admin.html" class="btn" style="margin-top:8px;">🔐 Back to Login</a>
                        </div>
                    `;
                    showStatus('🔓 No token found', 'error');
                }

            } catch (error) {
                log('❌ Error: ' + error.message, 'error');
                document.getElementById('result').innerHTML = `
                    <div class="error">
                        <p style="font-size:1rem;">❌ ${error.message}</p>
                        <a href="admin.html" class="btn" style="margin-top:8px;">🔐 Back to Login</a>
                    </div>
                `;
                showStatus('❌ Failed', 'error');
            }
        }

        document.addEventListener('DOMContentLoaded', verifyEmail);
    </script>

</body>
</html>
