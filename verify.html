<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin Login</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0f172a;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .card {
            background: #1e293b;
            padding: 40px 36px;
            border-radius: 16px;
            max-width: 400px;
            width: 100%;
            border: 1px solid #334155;
        }
        .card h1 {
            font-size: 1.8rem;
            text-align: center;
            margin-bottom: 4px;
            background: linear-gradient(90deg, #00bcd4, #008c9e);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .card .subtitle {
            color: #94a3b8;
            text-align: center;
            font-size: 0.9rem;
            margin-bottom: 24px;
        }
        .field {
            margin-bottom: 16px;
        }
        .field label {
            display: block;
            font-size: 0.8rem;
            color: #94a3b8;
            margin-bottom: 6px;
            font-weight: 500;
        }
        .field input {
            width: 100%;
            padding: 12px 14px;
            border-radius: 8px;
            border: 1px solid #334155;
            background: #0f172a;
            color: #ffffff;
            font-size: 0.95rem;
            box-sizing: border-box;
            transition: border-color 0.2s;
        }
        .field input:focus {
            outline: none;
            border-color: #00bcd4;
        }
        .btn {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            margin-top: 4px;
        }
        .btn-primary {
            background: #00bcd4;
            color: #0f172a;
        }
        .btn-primary:hover {
            background: #008c9e;
            transform: scale(1.02);
        }
        .btn-outline {
            background: transparent;
            border: 1px solid #334155;
            color: #94a3b8;
        }
        .btn-outline:hover {
            border-color: #00bcd4;
            color: #00bcd4;
        }
        .btn-outline.hidden {
            display: none;
        }
        .message {
            padding: 10px 12px;
            border-radius: 6px;
            margin-top: 12px;
            font-size: 0.85rem;
            display: none;
        }
        .message.error {
            display: block;
            background: rgba(248, 113, 113, 0.12);
            border: 1px solid rgba(248, 113, 113, 0.25);
            color: #f87171;
        }
        .message.success {
            display: block;
            background: rgba(74, 222, 128, 0.12);
            border: 1px solid rgba(74, 222, 128, 0.25);
            color: #4ade80;
        }
        .message.warning {
            display: block;
            background: rgba(251, 191, 36, 0.12);
            border: 1px solid rgba(251, 191, 36, 0.25);
            color: #fbbf24;
        }
        .status-bar {
            background: #0f172a;
            padding: 8px 12px;
            border-radius: 6px;
            margin-bottom: 20px;
            font-size: 0.8rem;
            color: #94a3b8;
            text-align: center;
        }
        .divider {
            display: flex;
            align-items: center;
            gap: 12px;
            margin: 16px 0;
            color: #64748b;
            font-size: 0.75rem;
        }
        .divider::before,
        .divider::after {
            content: "";
            flex: 1;
            height: 1px;
            background: #334155;
        }
        .footer-text {
            text-align: center;
            margin-top: 16px;
            font-size: 0.75rem;
            color: #64748b;
        }
        .footer-text a {
            color: #00bcd4;
            text-decoration: none;
        }
        .footer-text a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="card">
        <h1>Curiosity</h1>
        <p class="subtitle">Admin Login</p>

        <div class="status-bar" id="status">Ready</div>

        <div class="field">
            <label for="email">Email</label>
            <input type="email" id="email" placeholder="admin@curiosity.io" value="admin@curiosity.io" />
        </div>
        <div class="field">
            <label for="password">Password</label>
            <input type="password" id="password" placeholder="Enter your password" />
        </div>

        <button class="btn btn-primary" onclick="login()">Log In</button>

        <button class="btn btn-outline hidden" id="resendBtn" onclick="resendVerification()">
            Resend Verification Email
        </button>

        <div id="message" class="message"></div>

        <div class="divider">or</div>

        <a href="resend_verification.html" class="btn btn-outline" style="text-align:center; text-decoration:none; display:block;">
            Need Verification Email?
        </a>

        <div class="footer-text">
            <a href="index.html">Return to Homepage</a>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.6/dist/umd/supabase.min.js">
    </script>

    <script>
        const SUPABASE_URL = 'https://pfnbpgdtrxqyudeqrtbr.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_L9nklf0aUlRHBVuc6V-nFg_DqW79DV4';

        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let currentEmail = '';

        function showMessage(msg, type) {
            const el = document.getElementById('message');
            el.textContent = msg;
            el.className = 'message ' + type;
        }

        function setStatus(text) {
            document.getElementById('status').textContent = text;
        }

        function showResendButton(show) {
            const btn = document.getElementById('resendBtn');
            if (show) {
                btn.classList.remove('hidden');
            } else {
                btn.classList.add('hidden');
            }
        }

        async function login() {
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;

            showMessage('', '');
            setStatus('Logging in...');
            showResendButton(false);

            if (!email || !password) {
                showMessage('Please enter email and password.', 'error');
                setStatus('Missing fields');
                return;
            }

            currentEmail = email;

            try {
                const { data, error } = await supabaseClient.auth.signInWithPassword({
                    email: email,
                    password: password
                });

                if (error) {
                    showMessage(error.message, 'error');
                    setStatus('Login failed');
                    return;
                }

                const { data: user, error: userError } = await supabaseClient
                    .from('users')
                    .select('*')
                    .eq('id', data.user.id)
                    .maybeSingle();

                if (userError || !user) {
                    showMessage('User profile not found.', 'error');
                    setStatus('Profile error');
                    return;
                }

                if (!user.email_verified) {
                    showMessage('Please verify your email first. Check your inbox.', 'warning');
                    setStatus('Email not verified');
                    showResendButton(true);
                    await supabaseClient.auth.signOut();
                    return;
                }

                if (user.role !== 'admin') {
                    await supabaseClient.auth.signOut();
                    showMessage('Access denied. Admin only.', 'error');
                    setStatus('Not admin');
                    return;
                }

                showMessage('Welcome ' + user.name + '!', 'success');
                setStatus('Logged in!');
                localStorage.setItem('adminUser', JSON.stringify(user));

                setTimeout(() => {
                    window.location.href = 'admin_dashboard.html';
                }, 1000);

            } catch (err) {
                showMessage(err.message || 'Something went wrong.', 'error');
                setStatus('Error');
            }
        }

        async function resendVerification() {
            if (!currentEmail) {
                showMessage('Please enter your email first.', 'error');
                return;
            }

            setStatus('Sending...');
            showMessage('', '');

            try {
                const { error } = await supabaseClient.auth.resend({
                    type: 'signup',
                    email: currentEmail,
                    options: {
                        emailRedirectTo: window.location.origin + '/verify.html'
                    }
                });

                if (error) throw error;

                showMessage('Verification email sent! Check your inbox.', 'success');
                setStatus('Email sent');
                showResendButton(false);
            } catch (error) {
                showMessage(error.message || 'Failed to send.', 'error');
                setStatus('Failed');
            }
        }

        async function checkSession() {
            setStatus('Checking...');
            const { data: { session } } = await supabaseClient.auth.getSession();

            if (session) {
                const { data: user, error } = await supabaseClient
                    .from('users')
                    .select('name, role, email_verified')
                    .eq('id', session.user.id)
                    .maybeSingle();

                if (user && user.role === 'admin' && user.email_verified) {
                    setStatus('Already logged in');
                    showMessage('Redirecting to dashboard...', 'success');
                    setTimeout(() => {
                        window.location.href = 'admin_dashboard.html';
                    }, 1000);
                    return;
                }

                if (user && !user.email_verified) {
                    setStatus('Email not verified');
                    showMessage('Please verify your email first.', 'warning');
                    showResendButton(true);
                    return;
                }
            }

            setStatus('Enter credentials to login');
        }

        document.addEventListener('DOMContentLoaded', () => {
            checkSession();
        });
    </script>

</body>
</html>
