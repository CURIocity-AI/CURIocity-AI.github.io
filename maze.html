<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>The Maze — Universal</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css" rel="stylesheet" />
    <style>
        /* ================================================================
           RESET & BASE — Universal
           ================================================================ */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0f172a;
            color: #ffffff;
            overflow: hidden;
            height: 100%;
            position: relative;
            -webkit-tap-highlight-color: transparent;
            -webkit-text-size-adjust: 100%;
            -moz-text-size-adjust: 100%;
            -ms-text-size-adjust: 100%;
            text-size-adjust: 100%;
        }

        /* ================================================================
           LAUNCH PAGE
           ================================================================ */
        #launchPage {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: radial-gradient(ellipse at center, #1e293b 0%, #0f172a 100%);
            text-align: center;
            padding: clamp(20px, 5vw, 60px);
            transition: opacity 0.6s ease;
            z-index: 1;
            overflow: hidden;
        }

        #launchPage.hidden {
            opacity: 0;
            pointer-events: none;
        }

        .launch-icon {
            font-size: clamp(3rem, 10vw, 6rem);
            color: #fbbf24;
            margin-bottom: clamp(8px, 2vh, 20px);
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {
            0%,
            100% {
                transform: translateY(0);
            }
            50% {
                transform: translateY(-12px);
            }
        }

        .launch-title {
            font-size: clamp(1.8rem, 6vw, 4rem);
            font-weight: 800;
            background: linear-gradient(135deg, #00bcd4, #a78bfa, #fbbf24);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: clamp(4px, 1vh, 12px);
        }

        .launch-sub {
            color: #94a3b8;
            font-size: clamp(0.85rem, 2.5vw, 1.2rem);
            margin-bottom: clamp(20px, 4vh, 40px);
            max-width: min(90%, 500px);
            line-height: 1.6;
            padding: 0 10px;
        }

        .launch-btn {
            background: linear-gradient(135deg, #00bcd4, #a78bfa);
            color: #0f172a;
            border: none;
            padding: clamp(12px, 2.5vh, 20px) clamp(24px, 5vw, 60px);
            border-radius: 60px;
            font-size: clamp(0.9rem, 2.5vw, 1.2rem);
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            display: inline-flex;
            align-items: center;
            gap: 12px;
            box-shadow: 0 8px 40px rgba(0, 188, 212, 0.25);
            touch-action: manipulation;
        }

        .launch-btn:active {
            transform: scale(0.95);
        }

        .launch-shortcuts {
            margin-top: clamp(12px, 2vh, 24px);
            font-size: clamp(0.65rem, 1.5vw, 0.85rem);
            color: #64748b;
        }

        .launch-shortcuts kbd {
            background: #1e293b;
            padding: 4px 12px;
            border-radius: 6px;
            border: 1px solid #334155;
            font-size: clamp(0.6rem, 1.2vw, 0.75rem);
            color: #94a3b8;
            font-family: inherit;
        }

        /* ================================================================
           MAZE APP — Universal Layout
           ================================================================ */
        #mazeApp {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #0f172a;
            z-index: 2;
            display: none;
            flex-direction: column;
            overflow: hidden;
        }

        #mazeApp.show {
            display: flex;
        }

        /* HEADER — Universal */
        .maze-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: clamp(4px, 1vh, 10px) clamp(12px, 2vw, 24px);
            border-bottom: 1px solid #334155;
            flex-shrink: 0;
            background: #0f172a;
            z-index: 10;
            min-height: clamp(38px, 6vh, 56px);
            gap: 8px;
        }

        .maze-header .header-left {
            display: flex;
            align-items: center;
            gap: clamp(6px, 1.5vw, 16px);
        }

        .maze-header .header-title {
            font-size: clamp(0.65rem, 1.8vw, 1rem);
            font-weight: 600;
            color: #94a3b8;
            white-space: nowrap;
        }

        .maze-header .header-title span {
            color: #fbbf24;
        }

        .btn-911 {
            background: linear-gradient(135deg, #ef4444, #dc2626);
            color: #ffffff;
            border: none;
            padding: clamp(4px, 0.8vh, 8px) clamp(10px, 1.5vw, 20px);
            border-radius: 30px;
            font-size: clamp(0.55rem, 1.2vw, 0.85rem);
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            display: flex;
            align-items: center;
            gap: clamp(4px, 0.8vw, 8px);
            box-shadow: 0 2px 12px rgba(239, 68, 68, 0.3);
            font-family: inherit;
            flex-shrink: 0;
            animation: pulse-911 2s ease-in-out infinite;
            white-space: nowrap;
            touch-action: manipulation;
        }

        .btn-911:active {
            transform: scale(0.92);
        }

        .btn-911 i {
            font-size: clamp(0.5rem, 1vw, 0.8rem);
        }

        @keyframes pulse-911 {
            0%,
            100% {
                box-shadow: 0 2px 12px rgba(239, 68, 68, 0.3);
            }
            50% {
                box-shadow: 0 2px 24px rgba(239, 68, 68, 0.6);
            }
        }

        .btn-map {
            background: none;
            border: 1px solid #334155;
            color: #94a3b8;
            padding: clamp(3px, 0.6vh, 6px) clamp(8px, 1.2vw, 16px);
            border-radius: 20px;
            font-size: clamp(0.5rem, 1vw, 0.75rem);
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: inherit;
            display: flex;
            align-items: center;
            gap: clamp(3px, 0.5vw, 6px);
            white-space: nowrap;
            touch-action: manipulation;
        }

        .btn-map:active {
            transform: scale(0.95);
        }

        .btn-map i {
            font-size: clamp(0.45rem, 0.9vw, 0.7rem);
        }

        /* NAVIGATION — Universal */
        .maze-nav-wrapper {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: clamp(3px, 0.8vw, 14px);
            padding: clamp(4px, 0.8vh, 10px) clamp(8px, 1.5vw, 24px);
            border-bottom: 1px solid #334155;
            background: #0f172a;
            flex-shrink: 0;
            width: 100%;
            min-height: clamp(42px, 7vh, 76px);
            overflow-x: auto;
            scrollbar-width: none;
            -webkit-overflow-scrolling: touch;
        }

        .maze-nav-wrapper::-webkit-scrollbar {
            display: none;
        }

        .nav-slot {
            flex: 1;
            max-width: clamp(55px, 12vw, 140px);
            min-width: clamp(36px, 7vw, 80px);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .nav-slot.middle {
            flex: 1.3;
            max-width: clamp(65px, 14vw, 160px);
            min-width: clamp(42px, 8vw, 90px);
        }

        .maze-nav-btn {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
            padding: clamp(4px, 0.8vh, 14px) clamp(4px, 0.8vw, 18px);
            background: #1e293b;
            border: clamp(1.5px, 0.3vw, 3px) solid #334155;
            border-radius: clamp(8px, 1.5vw, 14px);
            color: #94a3b8;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            font-family: inherit;
            position: relative;
            min-height: clamp(34px, 6vh, 64px);
            width: 100%;
            text-align: center;
            font-size: clamp(0.35rem, 0.8vw, 0.7rem);
            font-weight: 600;
            line-height: 1.2;
            touch-action: manipulation;
            word-break: break-word;
        }

        .maze-nav-btn:active {
            transform: scale(0.95);
        }

        .maze-nav-btn.gate-btn {
            border-color: #fbbf24;
            background: rgba(251, 191, 36, 0.08);
            color: #fbbf24;
            animation: gatePulse 2s ease-in-out infinite;
        }

        @keyframes gatePulse {
            0%,
            100% {
                box-shadow: 0 0 0 0 rgba(251, 191, 36, 0);
            }
            50% {
                box-shadow: 0 0 20px rgba(251, 191, 36, 0.15);
            }
        }

        .maze-nav-btn.center-btn {
            cursor: default;
            border-color: #fbbf24;
            background: rgba(251, 191, 36, 0.08);
            color: #fbbf24;
        }

        .maze-nav-btn.exit-btn {
            border-color: #4ade80;
            background: rgba(74, 222, 128, 0.08);
            color: #4ade80;
            animation: exitPulse 1.5s ease-in-out infinite;
        }

        @keyframes exitPulse {
            0%,
            100% {
                box-shadow: 0 0 0 0 rgba(74, 222, 128, 0);
            }
            50% {
                box-shadow: 0 0 20px rgba(74, 222, 128, 0.15);
            }
        }

        /* MESSAGES WRAPPER — Universal */
        .maze-messages-wrapper {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-height: 0;
            overflow: hidden;
            background: #0f172a;
        }

        .maze-page-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: clamp(4px, 0.8vh, 10px) clamp(12px, 2vw, 24px);
            background: #0f172a;
            border-bottom: 1px solid #1a2332;
            flex-shrink: 0;
            min-height: clamp(30px, 5vh, 48px);
            gap: 8px;
        }

        .maze-page-bar .page-label {
            display: flex;
            align-items: center;
            gap: clamp(4px, 0.8vw, 10px);
            font-weight: 600;
            font-size: clamp(0.65rem, 1.5vw, 0.95rem);
            min-width: 0;
        }

        .maze-page-bar .page-label .color-dot {
            width: clamp(8px, 1.2vw, 14px);
            height: clamp(8px, 1.2vw, 14px);
            border-radius: 50%;
            display: inline-block;
            flex-shrink: 0;
        }

        .maze-page-bar .page-stats {
            font-size: clamp(0.55rem, 1vw, 0.8rem);
            color: #64748b;
            flex-shrink: 0;
        }

        /* BOT INDICATOR — Universal */
        .bot-indicator {
            display: none;
            align-items: center;
            gap: clamp(4px, 0.8vw, 10px);
            padding: clamp(2px, 0.5vh, 6px) clamp(12px, 2vw, 24px);
            font-size: clamp(0.55rem, 1vw, 0.8rem);
            color: #fbbf24;
            background: rgba(251, 191, 36, 0.08);
            border-bottom: 1px solid #3a2a0a;
            flex-shrink: 0;
            min-height: clamp(22px, 4vh, 36px);
        }

        .bot-indicator.show {
            display: flex;
        }

        .bot-indicator .bot-dot {
            width: clamp(6px, 1vw, 10px);
            height: clamp(6px, 1vw, 10px);
            border-radius: 50%;
            background: #fbbf24;
            animation: pulse-dot 1.5s ease-in-out infinite;
            flex-shrink: 0;
        }

        @keyframes pulse-dot {
            0%,
            100% {
                opacity: 1;
                transform: scale(1);
            }
            50% {
                opacity: 0.3;
                transform: scale(0.6);
            }
        }

        /* CHAT MESSAGES — Universal */
        .maze-chat-messages {
            flex: 1;
            overflow-y: auto;
            overflow-x: hidden;
            padding: clamp(8px, 1.5vh, 20px) clamp(12px, 2vw, 28px);
            background: #0f172a;
            -webkit-overflow-scrolling: touch;
            overscroll-behavior: contain;
            display: flex;
            flex-direction: column;
        }

        .messages-container {
            display: flex;
            flex-direction: column;
            gap: clamp(4px, 0.8vw, 10px);
            width: 100%;
            margin-top: auto;
            padding-bottom: clamp(2px, 0.5vh, 8px);
            min-height: min-content;
        }

        .msg-wrapper {
            width: 100%;
            max-width: clamp(70%, 85%, 90%);
            align-self: flex-start;
            border-radius: clamp(12px, 2vw, 20px);
            flex-shrink: 0;
            animation: msgAppear 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
            position: relative;
            overflow: hidden;
            touch-action: pan-y;
            cursor: pointer;
            user-select: none;
            -webkit-user-select: none;
        }

        .msg-wrapper.hidden-msg {
            display: none !important;
        }

        @keyframes msgAppear {
            from {
                opacity: 0;
                transform: translateY(20px) scale(0.96);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .msg-wrapper .swipe-hint {
            position: absolute;
            top: 0;
            left: 0;
            bottom: 0;
            display: flex;
            align-items: center;
            justify-content: flex-start;
            padding: 4px 12px;
            background: rgba(0, 188, 212, 0.1);
            border: 1px solid #00bcd4;
            border-radius: clamp(12px, 2vw, 20px);
            opacity: 0;
            transform: translateX(-100%);
            transition: opacity 0.2s ease, transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
            pointer-events: none;
            color: #00bcd4;
            font-size: clamp(0.5rem, 1vw, 0.85rem);
            font-weight: 500;
            gap: 6px;
            white-space: nowrap;
            z-index: 5;
        }

        .msg-wrapper.swiped .swipe-hint {
            opacity: 1;
            transform: translateX(0);
            pointer-events: none;
        }

        .msg-wrapper .msg-content-wrap {
            display: flex;
            gap: clamp(6px, 1.2vw, 14px);
            align-items: flex-start;
            padding: 4px;
            border-radius: clamp(12px, 2vw, 20px);
            transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
            transform: translateX(0);
            background: #0f172a;
            position: relative;
            z-index: 2;
        }

        .msg-wrapper.swiped .msg-content-wrap {
            transform: translateX(clamp(45px, 10vw, 90px));
        }

        .chat-msg {
            display: flex;
            gap: clamp(6px, 1.2vw, 14px);
            align-items: flex-start;
            width: 100%;
        }

        .chat-msg .msg-content {
            display: flex;
            flex-direction: column;
            gap: 2px;
            max-width: 100%;
            min-width: 0;
            align-items: flex-start;
        }

        .chat-msg .msg-bubble {
            background: #1e293b;
            padding: clamp(5px, 1vh, 12px) clamp(10px, 1.5vw, 18px);
            border: 1px solid #334155;
            border-radius: clamp(12px, 2vw, 20px);
            word-wrap: break-word;
            width: 100%;
        }

        .chat-msg .msg-bubble .msg-text {
            color: #e2e8f0;
            font-size: clamp(0.75rem, 1.8vw, 1.05rem);
            line-height: 1.5;
        }

        .chat-msg .msg-bubble .msg-time {
            font-size: clamp(0.4rem, 0.8vw, 0.65rem);
            color: #64748b;
            margin-top: 3px;
            display: block;
            text-align: right;
        }

        .chat-msg .msg-bubble .reply-wrap {
            background: rgba(0, 188, 212, 0.05);
            border-left: 3px solid #00bcd4;
            border-radius: 8px;
            padding: 6px 10px;
            margin-bottom: 6px;
        }

        .chat-msg .msg-bubble .reply-wrap .reply-user {
            font-weight: 600;
            font-size: clamp(0.5rem, 1vw, 0.75rem);
            color: #00bcd4;
        }
        .chat-msg .msg-bubble .reply-wrap .reply-text {
            color: #94a3b8;
            font-size: clamp(0.6rem, 1.2vw, 0.85rem);
            font-style: italic;
        }

        .chat-msg .msg-avatar {
            width: clamp(26px, 4vw, 48px);
            height: clamp(26px, 4vw, 48px);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: clamp(0.6rem, 1.2vw, 1rem);
            color: #0f172a;
            flex-shrink: 0;
            margin-top: 2px;
        }

        .chat-msg .msg-username {
            font-weight: 600;
            font-size: clamp(0.55rem, 1vw, 0.85rem);
            color: #94a3b8;
            padding: 0 4px;
            text-align: left;
            width: 100%;
        }

        .chat-msg.own .msg-bubble {
            background: rgba(0, 188, 212, 0.12);
            border-color: #00bcd4;
        }
        .chat-msg.own .msg-username {
            color: #00bcd4;
        }

        .chat-msg.bot .msg-avatar {
            background: linear-gradient(135deg, #fbbf24, #f59e0b);
            color: #0f172a;
            font-size: clamp(0.7rem, 1.4vw, 1.1rem);
        }
        .chat-msg.bot .msg-username {
            color: #fbbf24;
        }
        .chat-msg.bot .msg-bubble {
            background: rgba(251, 191, 36, 0.08);
            border-color: #fbbf24;
        }

        .chat-msg.arrival {
            align-self: center;
            max-width: 80%;
        }
        .chat-msg.arrival .msg-bubble {
            background: transparent;
            border: none;
            padding: 4px 12px;
        }
        .chat-msg.arrival .msg-bubble .msg-text {
            color: #94a3b8;
            font-size: clamp(0.6rem, 1.2vw, 0.85rem);
            text-align: center;
            font-style: italic;
        }
        .chat-msg.arrival .msg-bubble .msg-time {
            display: none;
        }
        .chat-msg.arrival .msg-avatar {
            display: none;
        }
        .chat-msg.arrival .msg-username {
            display: none;
        }

        .maze-chat-empty {
            color: #64748b;
            font-size: clamp(0.75rem, 1.8vw, 1rem);
            text-align: center;
            padding: clamp(20px, 5vh, 60px) 0;
            font-style: italic;
            align-self: center;
            width: 100%;
        }

        /* ================================================================
           INPUT AREA — Universal
           ================================================================ */
        .maze-chat-area {
            position: relative;
            bottom: 0;
            left: 0;
            right: 0;
            z-index: 100;
            background: #0f172a;
            border-top: 1px solid #1e293b;
            padding: clamp(4px, 0.8vh, 12px) clamp(12px, 2vw, 24px) clamp(6px, 1vh, 16px);
            flex-shrink: 0;
            min-height: clamp(50px, 8vh, 80px);
            margin-top: auto;
        }

        .maze-chat-area.hidden-input {
            display: none;
        }

        .reply-indicator {
            display: none;
            align-items: center;
            gap: 8px;
            padding: clamp(2px, 0.5vh, 6px) clamp(8px, 1.2vw, 16px) clamp(4px, 0.6vh, 8px) clamp(8px, 1.2vw, 16px);
            font-size: clamp(0.55rem, 1vw, 0.8rem);
            color: #94a3b8;
            border-bottom: 1px solid #1e293b;
            margin-bottom: clamp(4px, 0.6vh, 8px);
        }
        .reply-indicator.show {
            display: flex;
        }
        .reply-indicator .reply-label {
            color: #00bcd4;
            font-weight: 600;
        }
        .reply-indicator .reply-text {
            color: #e2e8f0;
            font-style: italic;
            max-width: clamp(80px, 30vw, 250px);
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .reply-indicator .reply-cancel {
            background: none;
            border: none;
            color: #64748b;
            cursor: pointer;
            padding: 2px 6px;
            border-radius: 6px;
            font-size: clamp(0.7rem, 1.2vw, 1rem);
            transition: all 0.2s ease;
            margin-left: auto;
            touch-action: manipulation;
        }
        .reply-indicator .reply-cancel:active {
            transform: scale(0.9);
        }

        .maze-chat-input-wrapper {
            display: flex;
            gap: clamp(6px, 1.2vw, 14px);
            align-items: center;
            background: #1e293b;
            border: 2px solid #334155;
            border-radius: clamp(20px, 4vw, 32px);
            padding: clamp(2px, 0.4vh, 6px) clamp(4px, 0.8vw, 10px) clamp(2px, 0.4vh, 6px) clamp(12px, 2vw, 22px);
            transition: all 0.3s ease;
            min-height: clamp(34px, 6vh, 52px);
        }

        .maze-chat-input-wrapper:focus-within {
            border-color: #00bcd4;
            box-shadow: 0 0 0 4px rgba(0, 188, 212, 0.1);
        }

        .maze-chat-input-wrapper input {
            flex: 1;
            background: transparent;
            border: none;
            padding: clamp(6px, 1vh, 14px) 0;
            color: #ffffff;
            font-size: clamp(0.75rem, 1.8vw, 1rem);
            font-family: inherit;
            outline: none;
            min-width: 0;
            -webkit-appearance: none;
            appearance: none;
        }

        .maze-chat-input-wrapper input::placeholder {
            color: #64748b;
            font-size: clamp(0.7rem, 1.5vw, 0.9rem);
        }

        .maze-chat-send-btn {
            background: linear-gradient(135deg, #00bcd4, #a78bfa);
            color: #0f172a;
            border: none;
            padding: clamp(5px, 0.8vh, 10px) clamp(12px, 2vw, 24px);
            border-radius: 30px;
            font-weight: 600;
            font-size: clamp(0.65rem, 1.4vw, 0.9rem);
            cursor: pointer;
            transition: all 0.3s ease;
            white-space: nowrap;
            display: flex;
            align-items: center;
            gap: clamp(4px, 0.6vw, 8px);
            flex-shrink: 0;
            min-height: clamp(28px, 4vh, 44px);
            touch-action: manipulation;
        }

        .maze-chat-send-btn:active {
            transform: scale(0.95);
        }

        .maze-chat-send-btn i {
            font-size: clamp(0.6rem, 1vw, 0.85rem);
        }

        /* ================================================================
           MAP MODAL — Universal
           ================================================================ */
        .map-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            z-index: 99999;
            justify-content: center;
            align-items: center;
            padding: clamp(12px, 2vh, 30px);
        }

        .map-overlay.show {
            display: flex;
        }

        .map-modal {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: clamp(16px, 3vw, 24px);
            padding: clamp(16px, 2.5vh, 36px);
            max-width: min(95vw, 600px);
            width: 100%;
            max-height: min(90vh, 600px);
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
        }

        .map-modal .map-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: clamp(12px, 2vh, 20px);
        }

        .map-modal .map-header h2 {
            font-size: clamp(1rem, 2.5vw, 1.4rem);
            color: #fbbf24;
        }

        .map-modal .map-close {
            background: none;
            border: none;
            color: #94a3b8;
            font-size: clamp(1rem, 2vw, 1.4rem);
            cursor: pointer;
            padding: 4px 8px;
            border-radius: 8px;
            transition: all 0.2s ease;
            touch-action: manipulation;
        }

        .map-modal .map-close:active {
            transform: scale(0.9);
        }

        .map-current {
            display: flex;
            align-items: center;
            gap: clamp(8px, 1.5vw, 16px);
            padding: clamp(10px, 1.5vh, 16px) clamp(12px, 2vw, 20px);
            background: rgba(251, 191, 36, 0.08);
            border: 1px solid #fbbf24;
            border-radius: clamp(10px, 1.5vw, 16px);
            margin-bottom: clamp(10px, 1.5vh, 16px);
            flex-wrap: wrap;
        }

        .map-current .cur-icon {
            font-size: clamp(1rem, 2vw, 1.4rem);
        }
        .map-current .cur-label {
            flex: 1;
            font-size: clamp(0.75rem, 1.8vw, 1rem);
            color: #fbbf24;
            font-weight: 600;
            min-width: 60px;
        }
        .map-current .cur-room {
            font-size: clamp(0.65rem, 1.5vw, 0.9rem);
            color: #94a3b8;
        }

        .map-gate {
            display: flex;
            align-items: center;
            gap: clamp(8px, 1.5vw, 16px);
            padding: clamp(10px, 1.5vh, 16px) clamp(12px, 2vw, 20px);
            background: rgba(251, 191, 36, 0.05);
            border: 1px dashed #fbbf24;
            border-radius: clamp(10px, 1.5vw, 16px);
            margin-bottom: clamp(12px, 2vh, 20px);
            flex-wrap: wrap;
        }

        .map-gate .gate-icon {
            font-size: clamp(1rem, 2vw, 1.4rem);
        }
        .map-gate .gate-label {
            flex: 1;
            font-size: clamp(0.75rem, 1.8vw, 1rem);
            color: #fbbf24;
            min-width: 60px;
        }
        .map-gate .gate-status {
            font-size: clamp(0.55rem, 1.2vw, 0.8rem);
            color: #64748b;
            padding: 2px 10px;
            border-radius: 12px;
            background: #0f172a;
            border: 1px solid #334155;
        }
        .map-gate .gate-status.found {
            border-color: #4ade80;
            color: #4ade80;
        }

        .map-network {
            margin-top: clamp(10px, 1.5vh, 16px);
            padding-top: clamp(10px, 1.5vh, 16px);
            border-top: 1px solid #334155;
        }

        .map-network .network-label {
            font-size: clamp(0.5rem, 1vw, 0.75rem);
            color: #64748b;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: clamp(8px, 1vh, 14px);
            display: block;
        }

        .map-room-node {
            display: flex;
            align-items: center;
            gap: clamp(6px, 1vw, 12px);
            padding: clamp(4px, 0.6vh, 8px) clamp(8px, 1.2vw, 14px);
            margin: 2px 0;
            border-radius: 8px;
            transition: all 0.2s ease;
            font-size: clamp(0.6rem, 1.2vw, 0.85rem);
            color: #94a3b8;
            border-left: 3px solid transparent;
        }

        .map-room-node.current {
            background: rgba(251, 191, 36, 0.08);
            border-left-color: #fbbf24;
            color: #fbbf24;
        }

        .map-room-node.gate-room {
            border-left-color: #fbbf24;
            opacity: 0.8;
        }

        .map-room-node .node-dot {
            width: clamp(6px, 0.8vw, 10px);
            height: clamp(6px, 0.8vw, 10px);
            border-radius: 50%;
            flex-shrink: 0;
            background: #334155;
        }

        .map-room-node.current .node-dot {
            background: #fbbf24;
            box-shadow: 0 0 12px rgba(251, 191, 36, 0.3);
        }

        .map-room-node.gate-room .node-dot {
            background: #fbbf24;
            opacity: 0.5;
        }

        .map-room-node .node-name {
            flex: 1;
        }

        .map-room-node .node-badge {
            font-size: clamp(0.4rem, 0.8vw, 0.6rem);
            padding: 1px 8px;
            border-radius: 10px;
            background: #0f172a;
            border: 1px solid #334155;
            color: #64748b;
        }

        .map-room-node.current .node-badge {
            border-color: #fbbf24;
            color: #fbbf24;
        }

        .map-room-node.gate-room .node-badge {
            border-color: #fbbf24;
            color: #fbbf24;
            opacity: 0.6;
        }

        .map-connections {
            margin-top: 8px;
            padding: clamp(6px, 1vh, 12px) clamp(8px, 1.2vw, 16px);
            background: #0f172a;
            border-radius: 8px;
            border: 1px solid #1a2332;
        }

        .map-connections .conn-label {
            font-size: clamp(0.45rem, 0.9vw, 0.7rem);
            color: #64748b;
            text-transform: uppercase;
            letter-spacing: 0.3px;
        }

        .map-connections .conn-list {
            display: flex;
            flex-wrap: wrap;
            gap: 4px 8px;
            margin-top: 4px;
        }

        .map-connections .conn-item {
            font-size: clamp(0.5rem, 1vw, 0.75rem);
            color: #94a3b8;
            padding: 2px 8px;
            background: #1e293b;
            border-radius: 12px;
            border: 1px solid #334155;
        }

        .map-connections .conn-item.gate-conn {
            border-color: #fbbf24;
            color: #fbbf24;
        }

        .map-find-btn {
            width: 100%;
            padding: clamp(10px, 1.5vh, 16px);
            margin-top: clamp(10px, 1.5vh, 16px);
            background: linear-gradient(135deg, #fbbf24, #f59e0b);
            color: #0f172a;
            border: none;
            border-radius: clamp(10px, 1.5vw, 16px);
            font-size: clamp(0.8rem, 2vw, 1.1rem);
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            font-family: inherit;
            touch-action: manipulation;
        }

        .map-find-btn:active {
            transform: scale(0.96);
        }

        .map-find-btn i {
            font-size: clamp(0.7rem, 1.5vw, 1rem);
        }

        .map-path {
            margin-top: clamp(10px, 1.5vh, 16px);
            padding: clamp(10px, 1.5vh, 16px) clamp(12px, 2vw, 20px);
            background: rgba(0, 188, 212, 0.05);
            border: 1px solid #00bcd4;
            border-radius: clamp(10px, 1.5vw, 16px);
        }

        .map-path .path-label {
            font-size: clamp(0.45rem, 0.9vw, 0.7rem);
            color: #64748b;
            text-transform: uppercase;
            letter-spacing: 0.3px;
        }

        .map-path .path-steps {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-top: 6px;
        }

        .map-path .path-step {
            font-size: clamp(0.5rem, 1vw, 0.75rem);
            color: #94a3b8;
            padding: 2px 10px;
            background: #1e293b;
            border-radius: 12px;
            border: 1px solid #334155;
        }

        .map-path .path-step.current-step {
            border-color: #fbbf24;
            color: #fbbf24;
        }

        .map-path .path-step.gate-step {
            border-color: #fbbf24;
            color: #fbbf24;
            opacity: 0.6;
        }

        .map-path .path-arrow {
            color: #334155;
        }

        /* ================================================================
           TOAST — Universal
           ================================================================ */
        .toast {
            position: fixed;
            bottom: clamp(80px, 15vh, 120px);
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: clamp(12px, 2vw, 20px);
            padding: clamp(10px, 1.5vh, 16px) clamp(16px, 2.5vw, 32px);
            display: flex;
            align-items: center;
            gap: clamp(8px, 1.2vw, 16px);
            color: #ffffff;
            font-size: clamp(0.75rem, 1.8vw, 1rem);
            z-index: 999999;
            transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            opacity: 0;
            pointer-events: none;
            box-shadow: 0 8px 40px rgba(0, 0, 0, 0.4);
            max-width: min(90%, 400px);
            text-align: center;
        }

        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
            pointer-events: auto;
        }

        .toast .toast-icon {
            font-size: clamp(1rem, 2vw, 1.4rem);
            flex-shrink: 0;
        }

        .toast.success .toast-icon {
            color: #4ade80;
        }
        .toast.error .toast-icon {
            color: #f87171;
        }
        .toast.warning .toast-icon {
            color: #fbbf24;
        }
        .toast.info .toast-icon {
            color: #60a5fa;
        }

            '#00bcd4', '#4ade80', '#fbbf24', '#f97316', '#a78bfa',
            '#f472b6', '#60a5fa', '#34d399', '#fb923c', '#e879f9',

        ];

        const EMERGENCY_RESPONSES = {
            'abuse': ["🚫 I've detected abusive behavior. Please be respectful. You've been warned."],
            'lost': ["🧭 You're lost? Don't worry. Use the Map (M key) to find your way back to The Gate."],

        // ================================================================

        function getAvatarColor(username) {
            if (username === BOT_NAME) return BOT_AVATAR_COLOR;
            let hash = 0;
            for (let i = 0; i < username.length; i++) {
                hash = username.charCodeAt(i) + ((hash << 5) - hash);
            }
            return avatarColors[Math.abs(hash) % avatarColors.length];
        }

        function getInitials(name) {
            if (name === BOT_NAME) return '👮';
            return name.charAt(0).toUpperCase();
        }

        function getTime() {
            return new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        }

        function generateId() {
            return Date.now() + '_' + Math.random().toString(36).substr(2, 5);
        }

        function detectEmergency(message) {
            const msg = message.toLowerCase();
            if (msg.match(/abuse|harass|bully|threat|attack|rude|insult/i)) return 'abuse';
            if (msg.match(/lost|stuck|cant find|where am i|confused|trapped|help|guide|direction|map/i)) return 'lost';
            if (msg.match(/spam|flood|too many|slow down|fast|repeating/i)) return 'spam';
            if (msg.match(/explicit|inappropriate|nsfw|profanity|swear|cuss|fuck|shit|damn|hell|ass|bitch/i)) return 'explicit';
            if (msg.match(/panic|scared|fear|worry|overwhelmed|alone|afraid|nervous/i)) return 'panic';
            if (msg.match(/all good|fine|okay|nothing|no problem|im okay|i'm fine|no issue/i)) return 'all_good';
            return 'unknown';
        }

        function findPathToGate(startId) {
            if (startId === 'gate_street') return ['gate_street'];

            const visited = new Set();
            const queue = [[startId]];
            visited.add(startId);

            while (queue.length > 0) {
                const path = queue.shift();
                const currentId = path[path.length - 1];
                const room = ROOMS[currentId];
                if (!room) continue;

                const connections = room.slots
                    .filter(s => s.action === 'goTo')
                    .map(s => s.target);

                for (const nextId of connections) {
                    if (visited.has(nextId)) continue;
                    if (!ROOMS[nextId]) continue;

                    const newPath = [...path, nextId];
                    if (nextId === 'gate_street') return newPath;

                    visited.add(nextId);
                    queue.push(newPath);
                }
            }
            return null;
        }

        // ================================================================
        //  DOM ELEMENTS
        // ================================================================
        const $ = (id) => document.getElementById(id);

        const DOM = {
            launchPage: $('launchPage'),

            chatInput: $('mazeChatInput'),

        // ================================================================
        const Render = {
            nav(roomId) {
                const room = ROOMS[roomId];
                if (!room) return;

                const slots = room.slots;
                for (let i = 0; i < 5; i++) {
                    const slot = slots[i];
                    const navSlot = DOM.navSlots[i];
                    if (!navSlot) continue;

                    const isCenter = i === 2;
                    navSlot.innerHTML = '';

                    const btn = document.createElement('button');
                    btn.className = 'maze-nav-btn';

                    if (slot.action === 'center') {
                        btn.classList.add('center-btn');
                        btn.setAttribute('style', `border-color: ${room.color};`);
                    } else if (slot.action === 'goTo') {
                        if (slot.target === 'gate_street') {
                            btn.classList.add('gate-btn');
                        }
                        btn.onclick = () => App.goToRoom(slot.target);
                    } else if (slot.action === 'exit') {
                        btn.classList.add('exit-btn');
                        btn.onclick = () => App.exitMaze();
                    }

                    navSlot.className = isCenter ? 'nav-slot middle' : 'nav-slot';
                    btn.textContent = slot.label;
                    navSlot.appendChild(btn);
                }
            },

            pageBar(roomId) {
                const room = ROOMS[roomId];
                if (!room) return;
                DOM.pageLabel.textContent = room.label;
                DOM.pageColorDot.style.background = room.color;
                const count = State.chatMessages.filter(m => m.page === roomId).length;
                DOM.pageStats.textContent = `💬 ${count} messages`;
            },

            messages(roomId) {
                DOM.emptyState.style.display = 'none';

                const allMessages = document.querySelectorAll('.msg-wrapper');
                let hasVisible = false;

                allMessages.forEach(el => {
                    const msgRoom = el.dataset.room;
                    if (msgRoom === roomId) {
                        el.classList.remove('hidden-msg');
                        hasVisible = true;
                    } else {
                        el.classList.add('hidden-msg');
                    }
                });

                if (!hasVisible) {
                    DOM.emptyState.style.display = 'block';
                }

                setTimeout(() => {
                    if (DOM.chatMessages) {
                        DOM.chatMessages.scrollTop = DOM.chatMessages.scrollHeight;
                    }
                }, 50);
            },

            appendMessage(msg) {
                DOM.emptyState.style.display = 'none';

                if (State.messageElements[msg.id]) {
                    const el = State.messageElements[msg.id];
                    if (msg.page === State.currentRoomId) {
                        el.classList.remove('hidden-msg');
                    } else {
                        el.classList.add('hidden-msg');
                    }
                    return;
                }

                const isOwn = msg.user === State.currentUser;
                const isBot = msg.user === BOT_NAME;
                const isArrival = msg.isArrival || false;
                const avatarColor = getAvatarColor(msg.user);
                const initials = getInitials(msg.user);

                let replyHtml = '';
                if (msg.replyTo) {
                    replyHtml = `
                        <div class="reply-wrap">
                            <div class="reply-user">↩ ${msg.replyTo.user}</div>
                            <div class="reply-text">${msg.replyTo.text}</div>
                        </div>
                    `;
                }

                const msgClass = isBot ? 'bot' : (isOwn ? 'own' : '');
                const msgId = 'msg_' + (msg.id || generateId());

                const wrapper = document.createElement('div');
                wrapper.className = `msg-wrapper ${msgClass}`;
                wrapper.id = msgId;
                wrapper.dataset.user = msg.user;
                wrapper.dataset.text = msg.text;
                wrapper.dataset.room = msg.page;

                if (msg.page !== State.currentRoomId) {
                    wrapper.classList.add('hidden-msg');
                }

                if (isArrival) {
                    wrapper.style.maxWidth = '100%';
                    wrapper.style.textAlign = 'center';
                    wrapper.innerHTML = `
                        <div class="msg-content-wrap" style="justify-content:center; padding:2px;">
                            <div class="chat-msg arrival">
                                <div class="msg-content" style="align-items:center; max-width:100%;">
                                    <div class="msg-bubble" style="background:transparent; border:none; padding:2px 12px;">
                                        <span class="msg-text" style="color:#94a3b8; font-size:0.75rem; font-style:italic; text-align:center;">${msg.text}</span>
                                    </div>
                                </div>
                            </div>
                        </div>
                    `;
                } else {
                    const swipeHint = `
                        <div class="swipe-hint">
                            <i class="fas fa-reply"></i> Reply
                        </div>
                    `;

                    wrapper.innerHTML = `
                        ${swipeHint}
                        <div class="msg-content-wrap">
                            <div class="chat-msg">
                                <div class="msg-avatar" style="background:${avatarColor};">
                                    ${initials}
                                </div>
                                <div class="msg-content">
                                    <span class="msg-username">${msg.user}</span>
                                    <div class="msg-bubble">
                                        ${replyHtml}
                                        <span class="msg-text">${msg.text}</span>
                                        <span class="msg-time">${msg.time}</span>
                                    </div>
                                </div>
                            </div>
                        </div>
                    `;

                    wrapper.addEventListener('touchstart', (e) => handleTouchStart(e, msgId));
                    wrapper.addEventListener('touchmove', (e) => handleTouchMove(e, msgId));
                    wrapper.addEventListener('touchend', (e) => handleTouchEnd(e, msgId));

                    wrapper.addEventListener('mousedown', (e) => handleMouseDown(e, msgId));
                    wrapper.addEventListener('mouseup', (e) => handleMouseUp(e, msgId));
                    wrapper.addEventListener('mouseleave', (e) => handleMouseUp(e, msgId));
                }

                State.messageElements[msgId] = wrapper;

                const emptyState = DOM.messagesContainer.querySelector('.maze-chat-empty');
                if (emptyState) {
                    DOM.messagesContainer.insertBefore(wrapper, emptyState);
                } else {
                    DOM.messagesContainer.appendChild(wrapper);
                }

                setTimeout(() => {
                    if (DOM.chatMessages) {
                        DOM.chatMessages.scrollTop = DOM.chatMessages.scrollHeight;
                    }
                }, 50);
            },

            botIndicator(roomId) {
                if (State.is911Active && State.botRoomId === roomId) {
                    DOM.botIndicator.classList.add('show');
                } else {
                    DOM.botIndicator.classList.remove('show');
                }
            },

            replyIndicator(user, text) {
                if (user && text) {
                    DOM.replyText.textContent = `@${user}: "${text}"`;
                    DOM.replyIndicator.classList.add('show');
                    DOM.chatInput.placeholder = `Reply to ${user}...`;
                } else {
                    DOM.replyIndicator.classList.remove('show');
                    DOM.chatInput.placeholder = 'Type a message...';
                }
            },

            map() {
                const currentRoom = ROOMS[State.currentRoomId];
                const isGateHere = State.currentRoomId === 'gate_street';
                const path = findPathToGate(State.currentRoomId);

                let html = '';

                html += `
                    <div class="map-current">
                        <span class="cur-icon">📍</span>
                        <span class="cur-label">You are here</span>
                        <span class="cur-room">${currentRoom ? currentRoom.label : 'Unknown'}</span>
                        <span style="font-size:0.6rem;color:#64748b;">${currentRoom ? currentRoom.type : ''}</span>
                    </div>
                `;

                html += `
                    <div class="map-gate">
                        <span class="gate-icon">🏛️</span>
                        <span class="gate-label">The Gate</span>
                        <span class="gate-status ${isGateHere ? 'found' : ''}">${isGateHere ? '✅ Here!' : '🔍 Find it'}</span>
                    </div>
                `;

                if (path && path.length > 0) {
                    html += `
                        <div class="map-path">
                            <div class="path-label">🛤️ Path to The Gate</div>
                            <div class="path-steps">
                    `;

                    path.forEach((roomId, index) => {
                        const room = ROOMS[roomId];
                        if (!room) return;
                        const isCurrent = index === 0;
                        const isGate = roomId === 'gate_street';
                        const stepClass = isCurrent ? 'current-step' : (isGate ? 'gate-step' : '');

                        html += `<span class="path-step ${stepClass}">${room.label}</span>`;
                        if (index < path.length - 1) {
                            html += `<span class="path-arrow">→</span>`;
                        }
                    });

                    html += `
                            </div>
                        </div>
                    `;
                }

                html += `
                    <div class="map-network">
                        <span class="network-label">🌐 City Network (${Object.keys(ROOMS).length} locations)</span>
                `;

                const types = {
                    '🏛️ Gate': [],
                    '🏙️ City Center': [],
                    '🏘️ Town': [],
                    '🏘️ Village': [],
                    '🛤️ Street': [],
                    '🛤️ Avenue': [],
                    '🛤️ Lane': [],
                    '🏠 House': [],
                    '✨ New Area': []
                };

                Object.keys(ROOMS).forEach(id => {
                    const room = ROOMS[id];
                    if (!room) return;
                    const type = room.type || '✨ New Area';
                    if (!types[type]) types[type] = [];
                    types[type].push({ id, room });
                });

                Object.keys(types).forEach(type => {
                    if (types[type].length === 0) return;
                    html += `<div style="margin-top:8px;font-size:0.55rem;color:#64748b;text-transform:uppercase;letter-spacing:0.3px;">${type}</div>`;

                    types[type].forEach(({ id, room }) => {
                        const isCurrent = id === State.currentRoomId;
                        const isGate = id === 'gate_street';

                        let nodeClass = 'map-room-node';
                        if (isCurrent) nodeClass += ' current';
                        if (isGate) nodeClass += ' gate-room';

                        const connections = room.slots
                            .filter(s => s.action === 'goTo')
                            .map(s => s.target)
                            .filter(target => ROOMS[target]);

                        html += `
                            <div class="${nodeClass}">
                                <span class="node-dot"></span>
                                <span class="node-name">${room.label}</span>
                                <span class="node-badge">${isCurrent ? '📍 You' : (isGate ? '🏛️ Gate' : '')}</span>
                            </div>
                        `;

                        if (isCurrent && connections.length > 0) {
                            html += `
                                <div class="map-connections">
                                    <div class="conn-label">🔗 Connections</div>
                                    <div class="conn-list">
                            `;

                            connections.forEach(targetId => {
                                const targetRoom = ROOMS[targetId];
                                if (!targetRoom) return;
                                const isGateConn = targetId === 'gate_street';
                                html += `
                                    <span class="conn-item ${isGateConn ? 'gate-conn' : ''}">${targetRoom.label}</span>
                                `;
                            });

                            html += `
                                    </div>
                                </div>
                            `;
                        }
                    });
                });

                html += `</div>`;

                if (!isGateHere && path && path.length > 1) {
                    const nextRoom = path[1];
                    const nextRoomObj = ROOMS[nextRoom];
                    if (nextRoomObj) {
                        html += `
                            <button class="map-find-btn" onclick="App.closeMap(); App.goToRoom('${nextRoom}');">
                                <i class="fas fa-compass"></i> Go to ${nextRoomObj.label}
                            </button>
                        `;
                    }
                } else if (isGateHere) {
                    html += `
                        <button class="map-find-btn" onclick="App.closeMap(); App.exitMaze();">
                            <i class="fas fa-door-open"></i> EXIT through The Gate 🎉
                        </button>
                    `;
                }

                DOM.mapContent.innerHTML = html;
                DOM.mapOverlay.classList.add('show');
            },

            toast(message, type = 'info') {
                const toast = document.getElementById('toast') || this.createToast();
                const toastMessage = toast.querySelector('#toastMessage');
                const icon = toast.querySelector('.toast-icon i');

                toast.className = 'toast';
                toast.classList.add(type);

                const icons = {
                    success: 'fa-check-circle',
                    error: 'fa-exclamation-circle',
                    info: 'fa-info-circle',
                    warning: 'fa-exclamation-triangle'
                };
                icon.className = 'fas ' + (icons[type] || icons.info);
                toastMessage.textContent = message;
                toast.classList.add('show');

                clearTimeout(window.toastTimeout);
                window.toastTimeout = setTimeout(() => {
                    toast.classList.remove('show');
                }, 3500);
            },

            createToast() {
                const toast = document.createElement('div');
                toast.className = 'toast';
                toast.id = 'toast';
                toast.innerHTML = `
                    <span class="toast-icon"><i class="fas fa-check-circle"></i></span>
                    <span id="toastMessage">Success!</span>
                `;
                document.body.appendChild(toast);
                return toast;
            }
        };

        // ================================================================
        //  SWIPE HANDLERS
        // ================================================================
        let touchStartX = 0,
            touchStartY = 0,
            swipeId = null,
            isSwiping = false;

        function handleTouchStart(e, id) {
            const touch = e.touches[0];
            touchStartX = touch.clientX;
            touchStartY = touch.clientY;
            swipeId = id;
            isSwiping = false;
        }

        function handleTouchMove(e, id) {
            if (swipeId !== id) return;
            const touch = e.touches[0];
            const diffX = touch.clientX - touchStartX;
            const diffY = touch.clientY - touchStartY;

            if (Math.abs(diffX) > Math.abs(diffY) && Math.abs(diffX) > 10) {
                e.preventDefault();
                isSwiping = true;
                const wrapper = document.getElementById(id);
                if (wrapper) {
                    const offset = Math.max(0, diffX - 10);
                    const content = wrapper.querySelector('.msg-content-wrap');
                    if (content) {
                        content.style.transform = `translateX(${Math.min(80, offset)}px)`;
                    }
                    if (diffX > 30) {
                        wrapper.classList.add('swiped');
                    } else {
                        wrapper.classList.remove('swiped');
                    }
                }
            }
        }

        function handleTouchEnd(e, id) {
            if (swipeId !== id) return;
            const wrapper = document.getElementById(id);
            if (wrapper) {
                const content = wrapper.querySelector('.msg-content-wrap');
                if (content) content.style.transform = '';
                if (wrapper.classList.contains('swiped')) {
                    const user = wrapper.dataset.user;
                    const text = wrapper.dataset.text;
                    if (user && user !== BOT_NAME) {
                        App.startReply(user, text);
                    }
                    wrapper.classList.remove('swiped');
                }
            }
            swipeId = null;
            isSwiping = false;
        }

        let mouseStartX = 0,
            mouseStartY = 0,
            mouseId = null,
            isDragging = false;

        function handleMouseDown(e, id) {
            if (e.button !== 0) return;
            mouseStartX = e.clientX;
            mouseStartY = e.clientY;
            mouseId = id;
            isDragging = false;
        }

        function handleMouseUp(e, id) {
            if (mouseId !== id) return;
            const wrapper = document.getElementById(id);
            if (wrapper) {
                const content = wrapper.querySelector('.msg-content-wrap');
                if (content) content.style.transform = '';
                if (isDragging && wrapper.classList.contains('swiped')) {
                    const user = wrapper.dataset.user;
                    const text = wrapper.dataset.text;
                    if (user && user !== BOT_NAME) {
                        App.startReply(user, text);
                    }
                    wrapper.classList.remove('swiped');
                } else {
                    wrapper.classList.remove('swiped');
                }
            }
            mouseId = null;
            isDragging = false;
        }

        document.addEventListener('mousemove', function(e) {
            if (mouseId === null) return;
            const diffX = e.clientX - mouseStartX;
            const diffY = e.clientY - mouseStartY;

            if (Math.abs(diffX) > Math.abs(diffY) && Math.abs(diffX) > 10) {
                isDragging = true;
                const wrapper = document.getElementById(mouseId);
                if (wrapper) {
                    const offset = Math.max(0, diffX - 10);
                    const content = wrapper.querySelector('.msg-content-wrap');
                    if (content) {
                        content.style.transform = `translateX(${Math.min(80, offset)}px)`;
                    }
                    if (diffX > 30) {
                        wrapper.classList.add('swiped');
                    } else {
                        wrapper.classList.remove('swiped');
                    }
                }
            }
        });

        // ================================================================
        //  APP CONTROLLER
        // ================================================================
        const App = {
            enterMaze(startRoomId = 'gate_street') {
                State.currentRoomId = startRoomId;
                State.isMazeOpen = true;
                State.navigationHistory = [startRoomId];

                DOM.launchPage.classList.add('hidden');
                DOM.mazeApp.classList.add('show');
                DOM.mazeChatArea.classList.remove('hidden-input');

                this.updateUI(startRoomId);
                setTimeout(() => DOM.chatInput.focus(), 400);
            },

            exitMaze() {
                State.isMazeOpen = false;
                DOM.mazeApp.classList.remove('show');
                DOM.mazeChatArea.classList.add('hidden-input');
                DOM.launchPage.classList.remove('hidden');
                this.cancelReply();
                State.is911Active = false;
                State.botRoomId = null;
                Render.botIndicator(State.currentRoomId);
                State.navigationHistory = [];
                Render.toast('🎉 You escaped the maze!', 'success');
            },

            goToRoom(roomId) {
                if (State.isTransitioning) return;
                if (roomId === State.currentRoomId) return;

                if (!ROOMS[roomId]) {
                    this.createNewRoom(roomId);
                    return;
                }

                State.navigationHistory.push(roomId);
                State.isTransitioning = true;

                State.currentRoomId = roomId;
                this.updateUI(roomId);
                DOM.chatInput.focus();
                this.cancelReply();

                setTimeout(() => {
                    State.isTransitioning = false;
                }, 50);
            },

            sendMessage() {
                const text = DOM.chatInput.value.trim();
                if (!text) {
                    DOM.chatInput.focus();
                    return;
                }

                const msg = {
                    id: generateId(),
                    user: State.currentUser,
                    text: text,
                    time: getTime(),
                    page: State.currentRoomId,
                    isSystem: false,
                    isArrival: false,
                    replyTo: State.replyingTo ? {
                        user: State.replyingTo.user,
                        text: State.replyingTo.text
                    } : null
                };

                State.chatMessages.push(msg);
                Render.appendMessage(msg);
                this.updateStats();

                DOM.chatInput.value = '';
                this.cancelReply();

                if (State.is911Active && State.botRoomId === State.currentRoomId) {
                    if (!msg.replyTo) {
                        const emergencyType = detectEmergency(text);
                        const responses = EMERGENCY_RESPONSES[emergencyType] || EMERGENCY_RESPONSES['unknown'];
                        const botReply = responses[Math.floor(Math.random() * responses.length)];

                        setTimeout(() => {
                            this.addBotMessage(botReply, State.currentRoomId);
                        }, 600);

                        if (emergencyType === 'all_good') {
                            setTimeout(() => {
                                State.is911Active = false;
                                State.botRoomId = null;
                                Render.botIndicator(State.currentRoomId);
                            }, 2000);
                        }
                    }
                }

                DOM.chatInput.focus();
            },

            call911() {
                if (State.is911Active && State.botRoomId === State.currentRoomId) {
                    this.addBotMessage("👮 I'm already here. What's going on?", State.currentRoomId);
                    return;
                }

                if (State.is911Active && State.botRoomId !== State.currentRoomId) {
                    State.botRoomId = State.currentRoomId;
                    this.addBotMessage("👮 I've moved to this room. What's going on here?", State.currentRoomId);
                    Render.botIndicator(State.currentRoomId);
                    return;
                }

                State.is911Active = true;
                State.botRoomId = State.currentRoomId;
                Render.botIndicator(State.currentRoomId);

                const arrivalMsg = {
                    id: generateId() + '_arrival',
                    user: 'System',
                    text: '👮 CSO has arrived..!',
                    time: getTime(),
                    page: State.currentRoomId,
                    isSystem: false,
                    isArrival: true,
                    replyTo: null
                };

                State.chatMessages.push(arrivalMsg);
                Render.appendMessage(arrivalMsg);
                this.updateStats();

                setTimeout(() => {
                    this.addBotMessage("What's going on here?", State.currentRoomId);
                }, 500);

                DOM.chatInput.focus();
            },

            openMap() {
                if (!State.isMazeOpen) return;
                Render.map();
            },

            closeMap() {
                DOM.mapOverlay.classList.remove('show');
            },

            startReply(user, text) {
                if (!user || !text) return;
                State.replyingTo = { user, text };
                Render.replyIndicator(user, text);
                DOM.chatInput.focus();
            },

            cancelReply() {
                State.replyingTo = null;
                Render.replyIndicator(null, null);
            },

            updateUI(roomId) {
                Render.nav(roomId);
                Render.pageBar(roomId);
                Render.botIndicator(roomId);
                Render.messages(roomId);
            },

            updateStats() {
                const count = State.chatMessages.filter(m => m.page === State.currentRoomId).length;
                DOM.pageStats.textContent = `💬 ${count} messages`;
            },

            addBotMessage(text, roomId) {
                const msg = {
                    id: generateId() + '_bot',
                    user: BOT_NAME,
                    text: text,
                    time: getTime(),
                    page: roomId,
                    isSystem: false,
                    isArrival: false,
                    replyTo: null
                };

                State.chatMessages.push(msg);
                Render.appendMessage(msg);
                this.updateStats();
            },

            createNewRoom(roomId) {
                const parentRoom = ROOMS[State.currentRoomId];
                const uniqueName = ROOM_NAME_POOL[State.nameIndex % ROOM_NAME_POOL.length];
                State.nameIndex++;

                ROOMS[roomId] = {
                    id: roomId,
                    label: uniqueName,
                    color: '#94a3b8',
                    type: '✨ New Area',
                    slots: [
                        { label: '🌟 Unknown', action: 'goTo', target: 'new_' + State.nextRoomId++ },
                        { label: '🌟 Unknown', action: 'goTo', target: 'new_' + State.nextRoomId++ },
                        { label: uniqueName, action: 'center' },
                        { label: '🌟 Unknown', action: 'goTo', target: 'new_' + State.nextRoomId++ },
                        { label: parentRoom.label, action: 'goTo', target: State.currentRoomId }
                    ]
                };

                State.navigationHistory.push(roomId);
                State.isTransitioning = true;

                State.currentRoomId = roomId;
                this.updateUI(roomId);
                DOM.chatInput.focus();
                this.cancelReply();

                setTimeout(() => {
                    State.isTransitioning = false;
                }, 50);
            }
        };

        // ================================================================
        //  KEYBOARD SHORTCUTS
        // ================================================================
        document.addEventListener('keydown', function(e) {
            if ((e.key === 'm' || e.key === 'M') && !State.isMazeOpen && !e.ctrlKey && !e.metaKey && !e.altKey) {
                e.preventDefault();
                App.enterMaze('gate_street');
                return;
            }

            if (!State.isMazeOpen) return;

            if (e.key === 'Enter' && !e.shiftKey && document.activeElement === DOM.chatInput) {
                e.preventDefault();
                App.sendMessage();
                return;
            }

            if (e.key === 'Escape') {
                if (DOM.mapOverlay.classList.contains('show')) {
                    App.closeMap();
                    return;
                }
                if (DOM.replyIndicator.classList.contains('show')) {
                    App.cancelReply();
                    return;
                }
                App.exitMaze();
                return;
            }

            if (e.key === 'm' || e.key === 'M') {
                App.openMap();
                return;
            }
        });

        window.App = App;

        console.log('%c🧩 THE MAZE - Universal', 'font-size:22px; font-weight:bold; color:#4ade80;');
        console.log('%c✅ Works on ALL devices!', 'font-size:14px; color:#4ade80');
        console.log('%c📱 Phones | Tablets | Desktops | Landscape', 'font-size:14px; color:#4ade80');
        console.log('%c🌙 Dark/Light mode support', 'font-size:14px; color:#4ade80');
        console.log('%c♿ Accessibility ready', 'font-size:14px; color:#4ade80');
        console.log('%c📖 M to open | ESC to exit | M for Map', 'font-size:14px; color:#00bcd4');
    </script>

</body>
</html>
