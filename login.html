<!DOCTYPE html><html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Curiosity ($CURI)</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        *, *::before, *::after {
            box-sizing: inherit;
        }
        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #0f172a, #1e293b);
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 30px;
            background: rgba(15, 23, 42, 0.9);
        }
        nav a {
            color: #ffffff;
            text-decoration: none;
            font-size: 1.2rem;
        }
        .login-wrapper {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px 20px;
        }
        .login-card {
            background: rgba(15, 23, 42, 0.8);
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
            padding: 40px 30px;
            width: 100%;
            max-width: 380px;
        }
        .login-card h1 {
            font-size: 2rem;
            margin: 0 0 5px;
            background: linear-gradient(90deg, #00bcd4, #008c9e);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .login-card p.subtitle {
            margin: 0 0 25px;
            color: #cccccc;
            font-size: 0.95rem;
        }
        .field {
            text-align: left;
            margin-bottom: 18px;
        }
        .field label {
            display: block;
            font-size: 0.85rem;
            margin-bottom: 6px;
            color: #cccccc;
        }
        .field input {
            width: 100%;
            padding: 12px 14px;
            border-radius: 10px;
            border: 1px solid #334155;
            background: #0f172a;
            color: #ffffff;
            font-size: 1rem;
        }
        .field input:focus {
            outline: none;
            border-color: #00bcd4;
        }
        .btn-submit {
            width: 100%;
            background: #00bcd4;
            color: #ffffff;
            padding: 14px;
            border: none;
            border-radius: 50px;
            font-size: 1.1rem;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 10px;
        }
        .btn-submit:hover {
            background: #008c9e;
            transform: scale(1.03);
        }
        .form-footer {
            margin-top: 20px;
            font-size: 0.9rem;
            color: #cccccc;
        }
        .form-footer a {
            color: #00e0ff;
            text-decoration: none;
        }
        .form-footer a:hover {
            text-decoration: underline;
        }
        .error-message {
            display: none;
            background: rgba(239, 68, 68, 0.15);
            border: 1px solid #ef4444;
            color: #fecaca;
            padding: 10px 14px;
            border-radius: 8px;
            font-size: 0.85rem;
            margin-bottom: 18px;
        }
        @media (max-width: 480px) {
            .login-card {
                padding: 30px 20px;
            }
        }
    </style>
</head>
<body>
    <nav>
        <div><a href="index.html">Curiosity ($CURI)</a></div>
        <div><a href="index.html">&larr; Back to home</a></div>
    </nav>

    <div class="login-wrapper">
        <div class="login-card">
            <h1>Welcome back</h1>
            <p class="subtitle">Log in to your Curiosity account</p>

            <div class="error-message" id="errorMessage">Please enter both your email and password.</div>

            <form id="loginForm">
                <div class="field">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" placeholder="you@example.com" required>
                </div>
                <div class="field">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" placeholder="••••••••" required>
                </div>
                <button type="submit" class="btn-submit">Log In</button>
            </form>

            <div class="form-footer">
                Don't have an account? <a href="#">Sign up</a>
            </div>
        </div>
    </div>

    <script>
        document.getElementById("loginForm").addEventListener("submit", function(e) {
            e.preventDefault();
            const email = document.getElementById("email").value.trim();
            const password = document.getElementById("password").value.trim();
            const errorMessage = document.getElementById("errorMessage");

            if (!email || !password) {
                errorMessage.style.display = "block";
                return;
            }

            errorMessage.style.display = "none";
            // TODO: hook this up to your real authentication endpoint
            alert("Login submitted (this is a placeholder — connect it to your backend).");
        });
    </script>
</body>
</html>
