<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login - Curiosity Admin</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0f172a;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .card {
            background: #1e293b;
            padding: 40px 36px;
            border-radius: 16px;
            max-width: 400px;
            width: 100%;
            border: 1px solid #334155;
        }
        h2 {
            font-size: 1.8rem;
            margin-bottom: 4px;
            background: linear-gradient(90deg, #00bcd4, #008c9e);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .subtitle {
            color: #94a3b8;
            margin-bottom: 24px;
            font-size: 0.9rem;
        }
        .field {
            margin-bottom: 16px;
            text-align: left;
        }
        .field label {
            display: block;
            font-size: 0.78rem;
            color: #94a3b8;
            margin-bottom: 4px;
        }
        .field input {
            width: 100%;
            padding: 10px 14px;
            border-radius: 8px;
            border: 1px solid #334155;
            background: #0f172a;
            color: #ffffff;
            font-size: 0.95rem;
            box-sizing: border-box;
        }
        .field input:focus {
            outline: none;
            border-color: #00bcd4;
        }
        .btn {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            background: #00bcd4;
            color: #0f172a;
            transition: all 0.2s;
            margin-top: 8px;
        }
        .btn:hover {
            background: #008c9e;
            transform: scale(1.02);
        }
        .btn-success {
            background: #4ade80;
            color: #0f172a;
        }
        .btn-success:hover {
            background: #22c55e;
        }
        .error {
            color: #f87171;
            font-size: 0.85rem;
            margin-top: 8px;
            display: none;
            padding: 10px 12px;
            background: rgba(248, 113, 113, 0.1);
            border-radius: 6px;
            border: 1px solid rgba(248, 113, 113, 0.2);
        }
        .success {
            color: #4ade80;
            font-size: 0.85rem;
            margin-top: 8px;
            display: none;
            padding: 10px 12px;
            background: rgba(74, 222, 128, 0.1);
            border-radius: 6px;
            border: 1px solid rgba(74, 222, 128, 0.2);
        }
        .log {
            background: #0f172a;
            padding: 12px;
            border-radius: 8px;
            margin-top: 16px;
            font-size: 0.75rem;
            color: #94a3b8;
            max-height: 120px;
            overflow-y: auto;
            font-family: monospace;
            border: 1px solid #1e293b;
            white-space: pre-wrap;
            word-break: break-all;
        }
        .log .info {
            color: #00bcd4;
        }
        .log .success {
            color: #4ade80;
        }
        .log .error {
            color: #f87171;
        }
        .status-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 12px;
            background: #0f172a;
            border-radius: 6px;
            margin-bottom: 16px;
            font-size: 0.75rem;
        }
        .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            display: inline-block;
            margin-right: 6px;
        }
        .dot.green {
            background: #4ade80;
        }
        .dot.red {
            background: #f87171;
        }
        .dot.yellow {
            background: #fbbf24;
        }
        .btn-sm {
            padding: 4px 12px;
            font-size: 0.7rem;
            width: auto;
            margin-top: 0;
            background: transparent;
            border: 1px solid #334155;
            color: #94a3b8;
            cursor: pointer;
        }
        .btn-sm:hover {
            border-color: #00bcd4;
            color: #00bcd4;
        }
    </style>
</head>
<body>

    <div class="card">
        <h2>⚡ Curiosity</h2>
        <p class="subtitle">Admin Login</p>

        <div class="status-bar">
            <span><span class="dot" id="statusDot"></span> <span id="statusText">Loading...</span></span>
            <button class="btn-sm" onclick="checkAdmin()">🔄 Refresh</button>
        </div>

        <div id="loginForm">
            <div class="field">
                <label>Email</label>
                <input type="email" id="email" value="admin@curiosity.io">
            </div>
            <div class="field">
                <label>Password</label>
                <input type="password" id="password" value="Admin@2025!">
            </div>
            <button class="btn" onclick="login()">Log In</button>
            <div class="error" id="errorMsg"></div>
            <div class="success" id="successMsg"></div>
        </div>

        <div class="log" id="log">
            <span class="info">🚀 Loading...</span>
        </div>
    </div>

    <script>
        // ============================================================
        // SUPABASE CONFIG (Loaded first)
        // ============================================================
        const SUPABASE_URL = 'https://pfnbpgdtrxqyudeqrtbr.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_L9nklf0aUlRHBVuc6V-nFg_DqW79DV4';

        // Create Supabase client
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // ============================================================
        // LOG FUNCTION
        // ============================================================
        function log(msg, type = 'info') {
            const el = document.getElementById('log');
            const cls = type === 'error' ? 'error' : type === 'success' ? 'success' : 'info';
            el.innerHTML += `\n[${new Date().toLocaleTimeString()}] <span class="${cls}">${msg}</span>`;
            el.scrollTop = el.scrollHeight;
            console.log(`[${type}]`, msg);
        }

        // ============================================================
        // SET STATUS
        // ============================================================
        function setStatus(text, color) {
            document.getElementById('statusText').textContent = text;
            document.getElementById('statusDot').className = 'dot ' + color;
        }

        // ============================================================
        // CHECK ADMIN
        // ============================================================
        async function checkAdmin() {
            try {
                setStatus('Checking...', 'yellow');
                log('🔍 Checking admin...', 'info');

                const { data, error } = await supabaseClient
                    .from('users')
                    .select('name, email, role')
                    .eq('role', 'admin')
                    .limit(1);

                if (error) {
                    log('❌ Error: ' + error.message, 'error');
                    setStatus('⚠️ Error', 'red');
                    return;
                }

                if (data && data.length > 0) {
                    log('✅ Admin found: ' + data[0].name + ' (' + data[0].email + ')', 'success');
                    setStatus('✅ Admin exists', 'green');
                } else {
                    log('❌ No admin found', 'error');
                    setStatus('🔓 No admin', 'red');
                }
            } catch (err) {
                log('❌ Error: ' + err.message, 'error');
                setStatus('⚠️ Error', 'red');
            }
        }

        // ============================================================
        // LOGIN
        // ============================================================
        async function login() {
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;

            const errorEl = document.getElementById('errorMsg');
            const successEl = document.getElementById('successMsg');
            errorEl.style.display = 'none';
            successEl.style.display = 'none';

            log('🔄 Logging in as: ' + email, 'info');

            try {
                const { data, error } = await supabaseClient.auth.signInWithPassword({
                    email: email,
                    password: password
                });

                if (error) {
                    if (error.message.includes('Email not confirmed')) {
                        log('📧 Email not confirmed. Check your inbox!', 'error');
                        errorEl.textContent = '📧 Please confirm your email first. Check your inbox/spam.';
                        errorEl.style.display = 'block';
                        return;
                    }
                    throw error;
                }

                log('✅ Auth successful!', 'success');

                const { data: userData, error: userError } = await supabaseClient
                    .from('users')
                    .select('*')
                    .eq('id', data.user.id)
                    .single();

                if (userError) {
                    log('⚠️ User not found in database: ' + userError.message, 'error');
                    errorEl.textContent = 'User profile not found. Please contact admin.';
                    errorEl.style.display = 'block';
                    return;
                }

                if (userData.role !== 'admin') {
                    await supabaseClient.auth.signOut();
                    errorEl.textContent = 'Access denied. Admin privileges required.';
                    errorEl.style.display = 'block';
                    log('❌ Not an admin! Role: ' + userData.role, 'error');
                    return;
                }

                // SUCCESS!
                successEl.textContent = `✅ Welcome ${userData.name}! You are logged in as Admin.`;
                successEl.style.display = 'block';
                log(`🎉 SUCCESS! Welcome ${userData.name}!`, 'success');
                setStatus('✅ Logged in', 'green');

                successEl.innerHTML += `<br><br>
                    <a href="#" onclick="alert('✅ You are logged in! Full admin panel coming soon.')" 
                       style="color:#00bcd4; text-decoration:underline; cursor:pointer;">
                       🚀 You're logged in! Click here for dashboard →
                    </a>`;

            } catch (error) {
                errorEl.textContent = error.message || 'Login failed';
                errorEl.style.display = 'block';
                log('❌ Login error: ' + error.message, 'error');

                if (error.message.includes('Invalid login credentials')) {
                    errorEl.textContent = '❌ Invalid email or password. Try again.';
                }
            }
        }

        // ============================================================
        // INIT
        // ============================================================
        document.addEventListener('DOMContentLoaded', () => {
            log('🚀 Admin Login v1.0', 'info');
            log('🔗 Connected to: ' + SUPABASE_URL, 'info');
            checkAdmin();
        });
    </script>

    <!-- Load Supabase SDK AFTER everything else -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.6/dist/umd/supabase.min.js">
    </script>

</body>
</html>
