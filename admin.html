<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin Panel Test</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2">
    </script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #0f172a;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .card {
            background: #1e293b;
            padding: 40px;
            border-radius: 16px;
            max-width: 400px;
            width: 100%;
            border: 1px solid #334155;
        }
        h2 {
            margin-bottom: 4px;
            color: #00bcd4;
        }
        .subtitle {
            color: #94a3b8;
            margin-bottom: 24px;
        }
        .field {
            margin-bottom: 16px;
            text-align: left;
        }
        .field label {
            display: block;
            font-size: 0.8rem;
            color: #94a3b8;
            margin-bottom: 4px;
        }
        .field input {
            width: 100%;
            padding: 10px 14px;
            border-radius: 8px;
            border: 1px solid #334155;
            background: #0f172a;
            color: #fff;
            font-size: 1rem;
            box-sizing: border-box;
        }
        .field input:focus {
            outline: none;
            border-color: #00bcd4;
        }
        .btn {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            margin-top: 8px;
        }
        .btn-primary {
            background: #00bcd4;
            color: #0f172a;
        }
        .btn-primary:hover {
            background: #008c9e;
        }
        .btn-success {
            background: #4ade80;
            color: #0f172a;
        }
        .btn-success:hover {
            background: #22c55e;
        }
        .btn-danger {
            background: #f87171;
            color: #0f172a;
        }
        .btn-danger:hover {
            background: #ef4444;
        }
        .error {
            color: #f87171;
            font-size: 0.85rem;
            margin-top: 8px;
            display: none;
        }
        .success {
            color: #4ade80;
            font-size: 0.85rem;
            margin-top: 8px;
            display: none;
        }
        .tab-row {
            display: flex;
            gap: 8px;
            margin-bottom: 20px;
            background: #0f172a;
            border-radius: 8px;
            padding: 4px;
        }
        .tab-btn {
            flex: 1;
            padding: 8px 12px;
            border: none;
            border-radius: 6px;
            background: transparent;
            color: #94a3b8;
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: 500;
            transition: all 0.2s;
        }
        .tab-btn.active {
            background: #00bcd4;
            color: #0f172a;
        }
        .tab-btn:hover:not(.active) {
            background: rgba(0, 188, 212, 0.1);
        }
        .hidden {
            display: none !important;
        }
        .log {
            background: #0f172a;
            padding: 12px;
            border-radius: 8px;
            margin-top: 16px;
            font-size: 0.8rem;
            color: #94a3b8;
            max-height: 200px;
            overflow-y: auto;
            font-family: monospace;
            white-space: pre-wrap;
            word-break: break-all;
        }
        .log .info {
            color: #00bcd4;
        }
        .log .success {
            color: #4ade80;
        }
        .log .error {
            color: #f87171;
        }
    </style>
</head>
<body>

    <div class="card">
        <h2>⚡ Curiosity</h2>
        <p class="subtitle">Admin Panel Test</p>

        <div class="tab-row">
            <button class="tab-btn active" id="loginTab" onclick="showTab('login')">Login</button>
            <button class="tab-btn" id="setupTab" onclick="showTab('setup')">Setup</button>
        </div>

        <!-- Login Form -->
        <div id="loginForm">
            <div class="field">
                <label>Email</label>
                <input type="email" id="loginEmail" placeholder="admin@curiosity.io">
            </div>
            <div class="field">
                <label>Password</label>
                <input type="password" id="loginPassword" placeholder="••••••••">
            </div>
            <button class="btn btn-primary" onclick="handleLogin()">Log In</button>
            <div class="error" id="loginError"></div>
        </div>

        <!-- Setup Form -->
        <div id="setupForm" class="hidden">
            <p style="color:#94a3b8; font-size:0.85rem; margin-bottom:16px;">
                Create the first admin account.
            </p>
            <div class="field">
                <label>Full Name</label>
                <input type="text" id="setupName" placeholder="Admin User">
            </div>
            <div class="field">
                <label>Email</label>
                <input type="email" id="setupEmail" placeholder="admin@yourdomain.com">
            </div>
            <div class="field">
                <label>Password (min 8)</label>
                <input type="password" id="setupPassword" placeholder="••••••••">
            </div>
            <div class="field">
                <label>Confirm Password</label>
                <input type="password" id="setupConfirm" placeholder="••••••••">
            </div>
            <button class="btn btn-success" onclick="handleSetup()">Create Admin Account</button>
            <div class="error" id="setupError"></div>
            <div class="success" id="setupSuccess"></div>
        </div>

        <!-- Log -->
        <div class="log" id="log">
            <span class="info">🔗 Ready. Click Setup to create admin.</span>
        </div>
    </div>

    <script>
        // ============================================================
        // ===== SUPABASE CONFIG =====
        // ============================================================
        const SUPABASE_URL = 'https://pfnbpgdtrxqyudeqrtbr.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_L9nklf0aUlRHBVuc6V-nFg_DqW79DV4';

        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let isAdminExists = false;

        // ============================================================
        // ===== LOG FUNCTION =====
        // ============================================================
        function log(message, type = 'info') {
            const logEl = document.getElementById('log');
            const time = new Date().toLocaleTimeString();
            logEl.innerHTML += `\n[${time}] <span class="${type}">${message}</span>`;
            logEl.scrollTop = logEl.scrollHeight;
            console.log(`[${type}]`, message);
        }

        // ============================================================
        // ===== TAB SWITCH =====
        // ============================================================
        function showTab(tab) {
            const loginForm = document.getElementById('loginForm');
            const setupForm = document.getElementById('setupForm');
            const loginTab = document.getElementById('loginTab');
            const setupTab = document.getElementById('setupTab');

            if (tab === 'login') {
                loginForm.classList.remove('hidden');
                setupForm.classList.add('hidden');
                loginTab.className = 'tab-btn active';
                setupTab.className = 'tab-btn';
                log('📋 Switched to Login tab', 'info');
            } else {
                loginForm.classList.add('hidden');
                setupForm.classList.remove('hidden');
                loginTab.className = 'tab-btn';
                setupTab.className = 'tab-btn active';
                log('📋 Switched to Setup tab', 'info');
                // Check if admin exists
                checkAdmin();
            }
        }

        // ============================================================
        // ===== CHECK IF ADMIN EXISTS =====
        // ============================================================
        async function checkAdmin() {
            try {
                log('🔍 Checking if admin exists...', 'info');
                const { data, error } = await supabase
                    .from('users')
                    .select('id')
                    .eq('role', 'admin')
                    .limit(1);

                if (error) {
                    log('❌ Error checking admin: ' + error.message, 'error');
                    return;
                }

                if (data && data.length > 0) {
                    isAdminExists = true;
                    document.getElementById('setupTab').style.display = 'none';
                    log('✅ Admin already exists! Setup tab hidden.', 'success');
                    if (document.getElementById('setupForm').classList.contains('hidden') === false) {
                        showTab('login');
                    }
                } else {
                    isAdminExists = false;
                    document.getElementById('setupTab').style.display = 'block';
                    log('ℹ️ No admin found. Setup tab available.', 'info');
                }
            } catch (err) {
                log('❌ Error: ' + err.message, 'error');
            }
        }

        // ============================================================
        // ===== HANDLE SETUP =====
        // ============================================================
        async function handleSetup() {
            const name = document.getElementById('setupName').value.trim();
            const email = document.getElementById('setupEmail').value.trim();
            const password = document.getElementById('setupPassword').value;
            const confirm = document.getElementById('setupConfirm').value;

            const errorEl = document.getElementById('setupError');
            const successEl = document.getElementById('setupSuccess');
            errorEl.style.display = 'none';
            successEl.style.display = 'none';

            log('🔄 Creating admin account...', 'info');

            // Validation
            if (!name || !email || !password || !confirm) {
                errorEl.textContent = 'Please fill in all fields.';
                errorEl.style.display = 'block';
                log('❌ Please fill in all fields.', 'error');
                return;
            }

            if (password.length < 8) {
                errorEl.textContent = 'Password must be at least 8 characters.';
                errorEl.style.display = 'block';
                log('❌ Password too short (min 8)', 'error');
                return;
            }

            if (password !== confirm) {
                errorEl.textContent = 'Passwords do not match.';
                errorEl.style.display = 'block';
                log('❌ Passwords do not match', 'error');
                return;
            }

            try {
                // Check again if admin exists
                const { data: existing, error: checkError } = await supabase
                    .from('users')
                    .select('id')
                    .eq('role', 'admin')
                    .limit(1);

                if (checkError) throw checkError;

                if (existing && existing.length > 0) {
                    errorEl.textContent = 'An admin already exists. Please login.';
                    errorEl.style.display = 'block';
                    log('❌ Admin already exists!', 'error');
                    document.getElementById('setupTab').style.display = 'none';
                    showTab('login');
                    return;
                }

                log('📝 Creating auth user...', 'info');

                // Create auth user
                const { data: authData, error: authError } = await supabase.auth.signUp({
                    email: email,
                    password: password,
                    options: {
                        data: { name: name, full_name: name, role: 'admin' }
                    }
                });

                if (authError) throw authError;

                log('✅ Auth user created: ' + authData.user.id, 'success');

                log('📝 Creating admin profile...', 'info');

                // Create admin profile
                const { data: userData, error: userError } = await supabase
                    .from('users')
                    .insert({
                        id: authData.user.id,
                        name: name,
                        email: email,
                        role: 'admin',
                        status: 'active',
                        balance: 0,
                        curi_balance: 1000,
                        staked: 0,
                        rewards: 0,
                        joined: new Date().toISOString()
                    })
                    .select()
                    .single();

                if (userError) throw userError;

                log('✅ Admin profile created!', 'success');

                // Add audit log
                await supabase
                    .from('audit_logs')
                    .insert({
                        user_id: authData.user.id,
                        action: 'admin_created',
                        details: `Admin account created: ${name} (${email})`
                    });

                successEl.textContent = '✅ Admin account created! You can now login.';
                successEl.style.display = 'block';

                document.getElementById('setupTab').style.display = 'none';
                log('🎉 Admin account created successfully!', 'success');
                log('🔑 Use your email and password to login.', 'info');

                showTab('login');

            } catch (error) {
                errorEl.textContent = error.message || 'Failed to create admin account.';
                errorEl.style.display = 'block';
                log('❌ Error: ' + error.message, 'error');
                console.error('Setup error:', error);
            }
        }

        // ============================================================
        // ===== HANDLE LOGIN =====
        // ============================================================
        async function handleLogin() {
            const email = document.getElementById('loginEmail').value.trim();
            const password = document.getElementById('loginPassword').value;

            const errorEl = document.getElementById('loginError');
            errorEl.style.display = 'none';

            log('🔄 Logging in...', 'info');

            try {
                const { data, error } = await supabase.auth.signInWithPassword({
                    email: email,
                    password: password
                });

                if (error) throw error;

                log('✅ Auth successful', 'success');

                // Check if user is admin
                const { data: userData, error: userError } = await supabase
                    .from('users')
                    .select('*')
                    .eq('id', data.user.id)
                    .single();

                if (userError) throw userError;

                if (userData.role !== 'admin') {
                    await supabase.auth.signOut();
                    errorEl.textContent = 'Access denied. Admin privileges required.';
                    errorEl.style.display = 'block';
                    log('❌ Access denied. Not an admin.', 'error');
                    return;
                }

                log('🎉 Welcome back ' + userData.name + '!', 'success');
                alert('✅ Login successful! Welcome ' + userData.name);

                // You're logged in! Now load the full admin panel
                // For now, just show success

            } catch (error) {
                errorEl.textContent = error.message || 'Invalid email or password';
                errorEl.style.display = 'block';
                log('❌ Login error: ' + error.message, 'error');
            }
        }

        // ============================================================
        // ===== CHECK SESSION =====
        // ============================================================
        async function checkSession() {
            try {
                const { data: { session } } = await supabase.auth.getSession();

                if (session) {
                    const { data: userData, error } = await supabase
                        .from('users')
                        .select('*')
                        .eq('id', session.user.id)
                        .single();

                    if (!error && userData && userData.role === 'admin') {
                        log('👋 Welcome back ' + userData.name + '!', 'success');
                        alert('✅ Already logged in as ' + userData.name);
                        return;
                    }
                }

                log('ℹ️ Not logged in. Use Setup or Login.', 'info');
                await checkAdmin();

            } catch (error) {
                log('❌ Session check error: ' + error.message, 'error');
            }
        }

        // ============================================================
        // ===== INIT =====
        // ============================================================
        document.addEventListener('DOMContentLoaded', () => {
            log('🚀 Admin Panel Test v1.0', 'info');
            log('🔗 Connected to: ' + SUPABASE_URL, 'info');
            checkSession();
        });
    </script>

</body>
</html>
