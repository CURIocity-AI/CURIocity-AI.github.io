<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Resend Verification</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0f172a;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .card {
            background: #1e293b;
            padding: 48px 40px;
            border-radius: 16px;
            max-width: 420px;
            width: 100%;
            border: 1px solid #334155;
        }

        .card h1 {
            font-size: 1.6rem;
            text-align: center;
            font-weight: 700;
            margin-bottom: 4px;
            background: linear-gradient(90deg, #00bcd4, #008c9e);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .card .subtitle {
            color: #94a3b8;
            text-align: center;
            font-size: 0.9rem;
            margin-bottom: 28px;
        }

        .field {
            margin-bottom: 18px;
        }

        .field label {
            display: block;
            font-size: 0.8rem;
            color: #94a3b8;
            margin-bottom: 6px;
            font-weight: 500;
        }

        .field input {
            width: 100%;
            padding: 12px 14px;
            border-radius: 8px;
            border: 1px solid #334155;
            background: #0f172a;
            color: #ffffff;
            font-size: 0.95rem;
            box-sizing: border-box;
            transition: border-color 0.2s;
        }

        .field input:focus {
            outline: none;
            border-color: #00bcd4;
        }

        .btn {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            margin-top: 4px;
        }

        .btn-success {
            background: #4ade80;
            color: #0f172a;
        }

        .btn-success:hover {
            background: #22c55e;
        }

        .btn-outline {
            background: transparent;
            border: 1px solid #334155;
            color: #94a3b8;
            text-align: center;
            text-decoration: none;
            display: block;
        }

        .btn-outline:hover {
            border-color: #00bcd4;
            color: #00bcd4;
        }

        .message {
            padding: 10px 12px;
            border-radius: 6px;
            margin-top: 14px;
            font-size: 0.85rem;
            display: none;
        }

        .message.error {
            display: block;
            background: rgba(248, 113, 113, 0.1);
            border: 1px solid rgba(248, 113, 113, 0.2);
            color: #f87171;
        }

        .message.success {
            display: block;
            background: rgba(74, 222, 128, 0.1);
            border: 1px solid rgba(74, 222, 128, 0.2);
            color: #4ade80;
        }

        .message.info {
            display: block;
            background: rgba(0, 188, 212, 0.1);
            border: 1px solid rgba(0, 188, 212, 0.2);
            color: #00bcd4;
        }

        .divider {
            display: flex;
            align-items: center;
            gap: 12px;
            margin: 18px 0;
            color: #64748b;
            font-size: 0.75rem;
        }

        .divider::before,
        .divider::after {
            content: "";
            flex: 1;
            height: 1px;
            background: #334155;
        }

        .footer-link {
            text-align: center;
            margin-top: 16px;
            font-size: 0.8rem;
            color: #64748b;
        }

        .footer-link a {
            color: #00bcd4;
            text-decoration: none;
        }

        .footer-link a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="card">
        <h1>Curiosity</h1>
        <p class="subtitle">Resend Verification Email</p>

        <div class="field">
            <label for="email">Email Address</label>
            <input type="email" id="email" placeholder="admin@curiosity.io" value="admin@curiosity.io" />
        </div>

        <button class="btn btn-success" onclick="sendVerification()">Send Verification Email</button>

        <div id="message" class="message"></div>

        <div class="divider">or</div>

        <a href="admin.html" class="btn btn-outline">Back to Login</a>

        <div class="footer-link">
            <a href="index.html">Return to Homepage</a>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.6/dist/umd/supabase.min.js">
    </script>

    <script>
        const SUPABASE_URL = 'https://pfnbpgdtrxqyudeqrtbr.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_L9nklf0aUlRHBVuc6V-nFg_DqW79DV4';

        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        function showMessage(msg, type) {
            const el = document.getElementById('message');
            el.textContent = msg;
            el.className = 'message ' + type;
        }

        async function sendVerification() {
            const email = document.getElementById('email').value.trim();

            showMessage('', '');

            if (!email) {
                showMessage('Please enter your email address.', 'error');
                return;
            }

            try {
                const { data: user, error: userError } = await supabaseClient
                    .from('users')
                    .select('email_verified')
                    .eq('email', email)
                    .maybeSingle();

                if (userError) {
                    showMessage('Database error. Please try again.', 'error');
                    return;
                }

                if (!user) {
                    showMessage('No account found with this email.', 'error');
                    return;
                }

                if (user.email_verified) {
                    showMessage('This email is already verified. You can login.', 'success');
                    return;
                }

                const { error: resendError } = await supabaseClient.auth.resend({
                    type: 'signup',
                    email: email,
                    options: {
                        emailRedirectTo: window.location.origin + '/verify.html'
                    }
                });

                if (resendError) {
                    const { error: magicError } = await supabaseClient.auth.signInWithOtp({
                        email: email,
                        options: {
                            emailRedirectTo: window.location.origin + '/verify.html'
                        }
                    });

                    if (magicError) throw magicError;
                }

                showMessage('Verification email sent! Check your inbox.', 'success');

            } catch (error) {
                showMessage(error.message || 'Something went wrong.', 'error');
            }
        }
    </script>

</body>
</html>
