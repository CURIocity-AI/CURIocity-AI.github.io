<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resend Verification</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.6/dist/umd/supabase.min.js">
    </script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0f172a;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            margin: 0;
        }
        .card {
            background: #1e293b;
            padding: 40px;
            border-radius: 16px;
            max-width: 450px;
            width: 100%;
            border: 1px solid #334155;
        }
        h1 {
            font-size: 1.8rem;
            background: linear-gradient(90deg, #00bcd4, #008c9e);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-align: center;
            margin-bottom: 8px;
        }
        .subtitle {
            color: #94a3b8;
            text-align: center;
            font-size: 0.9rem;
            margin-bottom: 24px;
        }
        .field {
            margin-bottom: 16px;
        }
        .field label {
            display: block;
            font-size: 0.8rem;
            color: #94a3b8;
            margin-bottom: 6px;
        }
        .field input {
            width: 100%;
            padding: 12px 14px;
            border-radius: 8px;
            border: 1px solid #334155;
            background: #0f172a;
            color: #fff;
            font-size: 0.95rem;
            box-sizing: border-box;
        }
        .field input:focus {
            outline: none;
            border-color: #00bcd4;
        }
        .btn {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            background: #00bcd4;
            color: #0f172a;
            transition: all 0.2s;
            margin-top: 8px;
        }
        .btn:hover {
            background: #008c9e;
            transform: scale(1.02);
        }
        .btn-success {
            background: #4ade80;
            color: #0f172a;
        }
        .btn-success:hover {
            background: #22c55e;
        }
        .msg {
            padding: 10px 12px;
            border-radius: 6px;
            margin-top: 12px;
            font-size: 0.85rem;
            display: none;
        }
        .msg.error {
            display: block;
            background: rgba(248, 113, 113, 0.15);
            border: 1px solid rgba(248, 113, 113, 0.3);
            color: #f87171;
        }
        .msg.success {
            display: block;
            background: rgba(74, 222, 128, 0.15);
            border: 1px solid rgba(74, 222, 128, 0.3);
            color: #4ade80;
        }
        .msg.warning {
            display: block;
            background: rgba(251, 191, 36, 0.15);
            border: 1px solid rgba(251, 191, 36, 0.3);
            color: #fbbf24;
        }
        .status {
            background: #0f172a;
            padding: 8px 12px;
            border-radius: 6px;
            margin-bottom: 20px;
            font-size: 0.8rem;
            color: #94a3b8;
            text-align: center;
        }
        .log {
            background: #0f172a;
            padding: 12px;
            border-radius: 8px;
            margin-top: 16px;
            font-size: 0.7rem;
            color: #64748b;
            max-height: 150px;
            overflow-y: auto;
            font-family: monospace;
            border: 1px solid #1e293b;
            line-height: 1.8;
            white-space: pre-wrap;
            word-break: break-all;
        }
        .log .info {
            color: #00bcd4;
        }
        .log .success {
            color: #4ade80;
        }
        .log .error {
            color: #f87171;
        }
        .log .warning {
            color: #fbbf24;
        }
    </style>
</head>
<body>

    <div class="card">
        <h1>⚡ Resend Verification</h1>
        <p class="subtitle">Enter your email to receive a verification link</p>

        <div class="status" id="status">🔍 Ready</div>

        <div class="field">
            <label>Email Address</label>
            <input type="email" id="email" placeholder="admin@curiosity.io" value="admin@curiosity.io">
        </div>

        <button class="btn btn-success" onclick="sendVerification()">📧 Send Verification Email</button>

        <div id="msg" class="msg"></div>

        <div class="log" id="log">
            <span class="info">🚀 Enter your email and click Send</span>
        </div>
    </div>

    <script>
        // ============================================================
        // ===== SUPABASE CONFIG =====
        // ============================================================
        const SUPABASE_URL = 'https://pfnbpgdtrxqyudeqrtbr.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_L9nklf0aUlRHBVuc6V-nFg_DqW79DV4';

        const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // ============================================================
        // ===== HELPERS =====
        // ============================================================
        function log(msg, type = 'info') {
            const el = document.getElementById('log');
            const cls = type === 'error' ? 'error' : type === 'success' ? 'success' : type === 'warning' ? 'warning' : 'info';
            el.innerHTML += `\n[${new Date().toLocaleTimeString()}] <span class="${cls}">${msg}</span>`;
            el.scrollTop = el.scrollHeight;
            console.log(`[${type}]`, msg);
        }

        function showMsg(msg, type) {
            const el = document.getElementById('msg');
            el.textContent = msg;
            el.className = 'msg ' + type;
        }

        function setStatus(text) {
            document.getElementById('status').textContent = text;
        }

        // ============================================================
        // ===== SEND VERIFICATION =====
        // ============================================================
        async function sendVerification() {
            const email = document.getElementById('email').value.trim();

            showMsg('', '');
            setStatus('📧 Sending...');

            if (!email) {
                showMsg('Please enter your email address.', 'error');
                setStatus('❌ Email required');
                return;
            }

            log('🔍 Checking user: ' + email, 'info');

            try {
                // Step 1: Check if user exists in database
                const { data: user, error: userError } = await supabase
                    .from('users')
                    .select('id, email, email_verified, status')
                    .eq('email', email)
                    .maybeSingle();

                if (userError) {
                    log('❌ Database error: ' + userError.message, 'error');
                    showMsg('Database error. Please try again.', 'error');
                    setStatus('❌ Error');
                    return;
                }

                if (!user) {
                    log('❌ User not found: ' + email, 'error');
                    showMsg('❌ No account found with this email.', 'error');
                    setStatus('❌ User not found');
                    return;
                }

                if (user.email_verified) {
                    log('✅ User already verified: ' + email, 'success');
                    showMsg('✅ This email is already verified! You can login.', 'success');
                    setStatus('✅ Already verified');
                    return;
                }

                log('📝 User found, sending verification...', 'info');

                // Step 2: Generate a verification token (using Supabase's built-in)
                // This is the proper way - Supabase handles the token generation
                const { error: resendError } = await supabase.auth.resend({
                    type: 'signup',
                    email: email,
                    options: {
                        emailRedirectTo: window.location.origin + '/verify.html'
                    }
                });

                if (resendError) {
                    log('❌ Resend error: ' + resendError.message, 'error');

                    // If resend fails, try to sign up again with the same email
                    if (resendError.message.includes('User already registered')) {
                        log('⚠️ User exists but resend failed. Trying alternative...', 'warning');

                        // Alternative: Generate a magic link
                        const { error: magicError } = await supabase.auth.signInWithOtp({
                            email: email,
                            options: {
                                emailRedirectTo: window.location.origin + '/verify.html'
                            }
                        });

                        if (magicError) {
                            throw magicError;
                        }
                    } else {
                        throw resendError;
                    }
                }

                log('✅ Verification email sent to: ' + email, 'success');
                showMsg('✅ Verification email sent! Check your inbox.', 'success');
                setStatus('✅ Email sent');
                document.getElementById('email').value = '';

            } catch (error) {
                log('❌ Error: ' + error.message, 'error');
                showMsg('❌ ' + error.message, 'error');
                setStatus('❌ Failed');
            }
        }

        // ============================================================
        // ===== CHECK SESSION =====
        // ============================================================
        async function checkSession() {
            const { data: { session } } = await supabase.auth.getSession();
            if (session) {
                log('👤 Session found: ' + session.user.email, 'info');
            } else {
                log('🔓 No active session', 'info');
            }
        }

        // ============================================================
        // ===== INIT =====
        // ============================================================
        document.addEventListener('DOMContentLoaded', () => {
            log('🚀 Resend Verification Page', 'info');
            log('🔗 Connected to: ' + SUPABASE_URL, 'info');
            checkSession();
        });
    </script>

</body>
</html>
